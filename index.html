        var starBtn = null;

      // 替换所有卡片的logo
      function replaceAllLogos() {
        var cards = document.querySelectorAll('div.bg-white.rounded-2xl.border');
        cards.forEach(function(card) {
          // 找到logo div
          var logoDiv = card.querySelector('.w-10.h-10.rounded-xl.bg-slate-100');
          if (!logoDiv) return;
          // 图片缺失已降级为文字，跳过
          if (logoDiv.getAttribute('data-logo-fallback')) return;
          // 如果已经替换过了就跳过
          if (logoDiv.querySelector('img')) return;
          // 用logo里的短文字作为key匹配
          var brandShortName = logoDiv.textContent.trim();
          // 如果这个品牌有对应的logo
          if (brandLogos[brandShortName]) {
            // 清空原来的文字
            logoDiv.textContent = '';
            // 创建img标签
            var logoImg = document.createElement('img');
            logoImg.src = brandLogos[brandShortName];
            logoImg.alt = brandShortName;
            logoImg.className = 'w-full h-full object-cover rounded-lg';
            // 图片不存在时自动恢复显示品牌文字，避免出现破图
            logoImg.onerror = function() {
              if (logoDiv.getAttribute('data-logo-fallback')) return;
              logoDiv.setAttribute('data-logo-fallback', '1');
              logoDiv.textContent = brandShortName;
            };
            logoDiv.appendChild(logoImg);
          }
        });
      }

          category: '数码3C',
          grade: 'B级'
        },
        {
          id: 'kfc-card',
          name: '肯德基',
          company: '百胜中国控股有限公司',
          logo: './assets/kfc.svg',
          logoAlt: '肯德基',
          workPolicy: '综合工时制 / 早中晚三班倒',
          overtime: '周末节假日必上班 / 晚班到23点',
          doubleRestRate: '10',
          offWorkTime: '23:00',
          voteCount: '0',
          desc: '"门店实行综合计算工时制，早中晚三班轮班，月休5-6天，周末及法定节假日正常上班（三薪），晚班普遍到23点（招聘信息+员工爆料交叉验证，2026-10核实：百胜中国官方直聘多店晚班15:00-23:00，爱企查工时库晚班15:00-23:00/16:00-24:00，23:00为众数）"',
          tags: ['快餐连锁', '餐饮', '百胜', 'KFC'],
          likeCount: '0',
          dislikeCount: '0',
          recommendText: '⚠️ 轮休制 / 周末节假日必上班',
          recommendColor: 'red',
          insertAfter: '瑞幸',
          keywords: ['肯德基', 'KFC', '快餐', '炸鸡', '百胜', '餐饮连锁'],
          category: '食品饮品',
          grade: 'C级'
        }
        // 以后在这里加新卡片配置就行，格式和上面一样
      ];
      // ====================================
      
      // 通用：根据评级找模板卡片（S/A/B/C级）
      function getGradeTemplateCard(grade) {
        var cards = document.querySelectorAll('div.bg-white.rounded-2xl.border');
        var fallback = null;
        // 兼容 "C级" 和 "C" 两种写法
        var g = String(grade).replace('级', '').trim();
        for (var card of cards) {
          // h2/h3 都要查：SEO 修复会把 h3 换成 h2
          var title = card.querySelector('h2') || card.querySelector('h3');
          if (!title) continue; // 必须是公司卡片
          if (!fallback) fallback = card;
          if (card.textContent.includes(g + '级') || card.textContent.includes(g + ' 级')) {
            return card;
          }
        }
        // 找不到对应评级时，退回第一张公司卡片当模板
        return fallback;
      }
      
      // 通用：根据h3关键词找目标卡片
      // 注意：SEO 的 fixHeadingHierarchy() 会把 h3 换成 h2，
      // 所以这里必须 h2/h3 都查，否则 H2 修复上线后定位全部失配。
      function findCardByH3(keyword) {
        var cards = document.querySelectorAll('div.bg-white.rounded-2xl.border');
        for (var card of cards) {
          var title = card.querySelector('h2') || card.querySelector('h3');
          if (title && title.textContent.includes(keyword)) {
            return card;
          }
        }
        return null;
      }
      
      // 通用：插入所有自定义卡片
      function insertAllCustomCards() {
        // 遍历配置，逐个生成并插入（已存在的卡片直接跳过，避免重复重建）
        customCardsConfig.forEach(function(config) {
          // 找插入位置的参考卡片
          var refCard = findCardByH3(config.insertAfter);
          if (!refCard) return;
          var existing = document.getElementById(config.id);
          if (existing) {
            // 卡片已存在：若位置漂移（React 重渲染可能导致），纠正到参考卡片后面
            if (existing.previousElementSibling !== refCard) {
              refCard.parentNode.insertBefore(existing, refCard.nextSibling);
            }
            return;
          }
          // 找对应评级的模板卡片
          var templateCard = getGradeTemplateCard(config.grade);
          if (!templateCard) return;
          
          // 克隆模板
          var newCard = templateCard.cloneNode(true);
          newCard.id = config.id;
          
          // 校正评级徽章（兼容徽章里的 "X级 · 描述" 结构）
          var badgeSpan = newCard.querySelector('span.inline-flex');
          if (badgeSpan && /[SABC]\s*级/.test(badgeSpan.textContent)) {
            badgeSpan.textContent = badgeSpan.textContent.replace(/[SABC]\s*级/, config.grade);
          }
          
          // 改品牌名（h2/h3 都要查：SEO 修复会把 h3 换成 h2）
          var nameEl = newCard.querySelector('h2') || newCard.querySelector('h3');
          if (nameEl) nameEl.textContent = config.name;
          // 改公司名
          newCard.querySelectorAll('p')[0].textContent = config.company;
          // 改logo
          var logoDiv = newCard.querySelector('.w-10');
          logoDiv.textContent = '';
          var logoImg = document.createElement('img');
          logoImg.src = config.logo;
          logoImg.alt = config.logoAlt;
          logoImg.className = 'w-full h-full object-cover rounded-lg';
          // 图片不存在时恢复显示品牌简称文字，避免出现破图
          logoImg.onerror = function() {
            if (logoDiv.getAttribute('data-logo-fallback')) return;
            logoDiv.setAttribute('data-logo-fallback', '1');
            logoDiv.textContent = config.logoAlt;
          };
          logoDiv.appendChild(logoImg);
          // 改工时政策
          var infoRows = newCard.querySelectorAll('.bg-slate-50 > div');
          infoRows[0].querySelectorAll('span')[1].textContent = config.workPolicy;
          infoRows[1].querySelectorAll('span')[1].textContent = config.overtime;
          // 改员工指数
          var stats = newCard.querySelectorAll('.bg-slate-900 .grid div div');
          // 注意: stats[0]=真实双休率标签, stats[1]=真实双休率值, stats[2]=平均离岗标签, stats[3]=平均离岗值
          // 只改值不改标签, 避免把"真实双休率:"标签覆盖掉
          stats[1].textContent = config.doubleRestRate;
          stats[3].textContent = config.offWorkTime;
          // 改描述
          newCard.querySelector('.bg-slate-900 .italic').textContent = config.desc;
          // 改标签
          var tags = newCard.querySelectorAll('.flex-wrap span');
          for (var i = 0; i < config.tags.length; i++) {
            if (tags[i]) tags[i].textContent = config.tags[i];
          }
          // 改点赞点踩数
          var voteBtns = newCard.querySelectorAll('.flex.items-center.gap-2 button span');
          if (voteBtns[0]) voteBtns[0].textContent = config.likeCount;
          if (voteBtns[1]) voteBtns[1].textContent = config.dislikeCount;
          // 改投票数
          var voteCount = newCard.querySelector('.bg-slate-900 .font-mono');
          if (voteCount) voteCount.textContent = config.voteCount + ' 人已投票';
          // 改推荐块
          var recommendBlock = null;
          var allDivs = newCard.querySelectorAll('div');
          allDivs.forEach(function(div) {
            if (div.textContent.includes('打工人推荐双休平替')) {
              recommendBlock = div;
            }
          });
          if (recommendBlock) {
            // 找到整块推荐容器（模板里的绿色/红色提示块），整体替换，清掉模板残留的"平替品牌"按钮（如 Philips Automotive 等）
            var container = recommendBlock;
            while (container && container !== newCard && container.className.indexOf('bg-emerald-50') < 0) {
              container = container.parentElement;
            }
            if (container && container !== newCard) {
              container.innerHTML = '<div style="font-weight:900;font-size:14px;">' + config.recommendText + '</div>';
              if (config.recommendColor === 'red') {
                container.className = container.className.replace(/border-emerald-200/g, 'border-red-200');
                container.className = container.className.replace(/bg-emerald-50/g, 'bg-red-50');
                container.style.color = '#dc2626';
              }
            } else {
              recommendBlock.innerHTML = '<div style="font-weight:900;font-size:14px;">' + config.recommendText + '</div>';
              if (config.recommendColor === 'red') {
                recommendBlock.className = recommendBlock.className.replace(/border-emerald-200/g, 'border-red-200');
                recommendBlock.className = recommendBlock.className.replace(/bg-emerald-50/g, 'bg-red-50');
                recommendBlock.style.color = '#dc2626';
              }
            }
          }
          // 兜底：模板卡里没有"打工人推荐双休平替"绿框时（如小米克隆自B级模板），
          // recommendBlock 为 null，上面的改造逻辑整段不执行，红框就不会出现。
          // 此时主动创建一个与肯德基等卡片样式一致的警示框，插在标签行之后。
          if (!recommendBlock && config.recommendText) {
            var isRed = config.recommendColor === 'red';
            var box = document.createElement('div');
            box.className = 'mt-3 rounded-xl border px-3 py-2 text-xs leading-relaxed ' +
              (isRed ? 'border-red-200 bg-red-50' : 'border-emerald-200 bg-emerald-50');
            box.style.color = isRed ? '#dc2626' : '#047857';
            box.style.fontWeight = '700';
            box.style.fontSize = '14px';
            box.innerHTML = '<div style="font-weight:900;font-size:14px;">' + config.recommendText + '</div>';
            box.setAttribute('data-recommend-box', '1');
            // 插到标签行（tags）后面；找不到就插到卡片末尾
            var tagRow = newCard.querySelector('.flex.flex-wrap');
            if (tagRow && tagRow.parentElement) {
              tagRow.parentElement.insertBefore(box, tagRow.nextSibling);
            } else {
              newCard.appendChild(box);
            }
          }

          // 插到参考卡片后面
          refCard.parentNode.insertBefore(newCard, refCard.nextSibling);
        });
      }
      
      // 在Apple卡片下面插入富士康双休提示框
      function insertAppleNote() {
        // 已经插过就跳过
        if (document.querySelector('#apple-note')) return;
        
        var cards = document.querySelectorAll('div.bg-white.rounded-2xl.border');
        var appleCard = null;
        cards.forEach(function(card) {
          if (card.textContent.includes('Apple (苹果中国)')) {
            appleCard = card;
          }
        });
        
        if (appleCard) {
          // 创建黄色提示框
          var note = document.createElement('div');
          note.id = 'apple-note';
          note.style.cssText = 'margin-top:12px;padding:10px 14px;background:#fef3c7;border:1px solid #fbbf24;border-radius:8px;color:#92400e;font-size:13px;';
          note.innerHTML = '💡 <strong>补充说明：</strong>富士康产线网传2023年起全面双休（部分地区存疑）；2019年成都园区核实为单休、两班倒';
          
          // 插到产品标签行下面
          var tagsRow = appleCard.querySelector('.flex-wrap');
          if (tagsRow) {
            tagsRow.parentNode.insertBefore(note, tagsRow.nextSibling);
          }
        }
      }
      
      // 自定义卡片的元数据（从配置自动生成，不用手动维护）
      var customCardsMeta = {};
      customCardsConfig.forEach(function(config) {
        customCardsMeta[config.id] = {
          keywords: config.keywords,
          category: config.category,
          grade: config.grade
        };
      });
      
      // 过滤自定义卡片，跟网站的搜索和筛选保持同步
      function filterCustomCards() {
        // 获取当前搜索关键词
        var searchInput = document.querySelector('input[placeholder*="搜索"]');
        var keyword = searchInput ? searchInput.value.trim().toLowerCase() : '';
        
        // 获取当前选中的品类按钮（高亮的那个）
        var activeCategory = '全部';
        var categoryBtns = document.querySelectorAll('button');
        categoryBtns.forEach(function(btn) {
          var text = btn.textContent.trim();
          if (['全部', '数码外设', '数码3C', '户外服饰', '个人护理', '运动器材', '零食饮料', '汽车用品', '互联网软件', '家电数码', '物流服务', '汽车生活', '食品饮品', '互联网服务', '服装饰品'].includes(text)) {
            // 判断是不是选中状态（通常是背景色变深）
            if (btn.className.includes('bg-emerald') || btn.className.includes('bg-black') || btn.className.includes('bg-gray-900')) {
              activeCategory = text;
            }
          }
        });
        
        // 获取当前选中的评级
        var activeGrade = '全部评级';
        categoryBtns.forEach(function(btn) {
          var text = btn.textContent.trim();
          if (['全部评级', 'S 级', 'A 级', 'B 级', 'C 级'].includes(text)) {
            if (btn.className.includes('bg-black') || btn.className.includes('bg-gray-900')) {
              activeGrade = text;
            }
          }
        });
        
        // 遍历所有自定义卡片，判断显示还是隐藏
        Object.keys(customCardsMeta).forEach(function(cardId) {
          var card = document.getElementById(cardId);
          if (!card) return;
          
          var meta = customCardsMeta[cardId];
          var shouldShow = true;
          
          // 1. 检查搜索关键词
          if (keyword) {
            var matchKeyword = meta.keywords.some(function(k) {
              return k.toLowerCase().includes(keyword);
            });
            if (!matchKeyword) shouldShow = false;
          }
          
          // 2. 检查品类筛选
          if (activeCategory !== '全部') {
            if (meta.category !== activeCategory) shouldShow = false;
          }
          
          // 3. 检查评级筛选
          if (activeGrade !== '全部评级') {
            var gradeShort = activeGrade.replace(' ', ''); // "S 级" -> "S级"
            if (meta.grade !== gradeShort) shouldShow = false;
          }
          
          // 显示或隐藏
          card.style.display = shouldShow ? '' : 'none';
        });
      }
      
      // 立刻试一次，不行就监听页面变化
      function init() {
        replaceLinksAndButtons();
        insertAllCustomCards();
        replaceAllLogos();
        insertAppleNote();
        filterCustomCards();
        scheduleHeadingFix();
      }
      init();

      // SEO：补齐缺失的 H2 层级（页面只有 1 个 H1 + 36 个 H3，中间无 H2）
      // 品牌名卡片是 H1 下的同级并列内容，语义上应为 H2。
      //
      // 安全要点（曾在此处翻车过，务必保留）：
      // 1. 用 requestAnimationFrame 脱离 MutationObserver 回调栈，
      //    否则在 observer 触发的同步执行中替换节点会与之互相干扰。
      // 2. 每个卡片用 data 属性做幂等标记，重复触发不会重复插入。
      // 3. 只在 h3 的直接父节点上做替换，不移动/重排任何其他节点。
      // 4. 保留原 className，外观零变化（卡片 h3 的 class 全是 Tailwind 工具类）。
      var headingFixScheduled = false;
      function scheduleHeadingFix() {
        if (headingFixScheduled) return;
        headingFixScheduled = true;
        requestAnimationFrame(function() {
          headingFixScheduled = false;
          try { fixHeadingHierarchy(); } catch (e) { /* 失败不影响页面 */ }
        });
      }

      function fixHeadingHierarchy() {
        var root = document.getElementById('root');
        if (!root) return;
        var cards = root.querySelectorAll('div.bg-white.rounded-2xl.border');
        for (var i = 0; i < cards.length; i++) {
          var card = cards[i];
          if (card.getAttribute('data-h2-checked') === '1') continue;
          var h3 = card.querySelector('h3');
          if (!h3 || !h3.parentNode) { card.setAttribute('data-h2-checked', '1'); continue; }
          var h2 = document.createElement('h2');
          h2.innerHTML = h3.innerHTML;
          h2.className = h3.className;      // 样式完全沿用
          h2.setAttribute('data-h2-fixed', '1');
          h3.parentNode.replaceChild(h2, h3);
          card.setAttribute('data-h2-checked', '1');
        }
      }
      
      // 监听搜索框输入
      document.addEventListener('input', function(e) {
        if (e.target && e.target.placeholder && e.target.placeholder.includes('搜索')) {
          filterCustomCards();
        }
      });
      
      // 监听所有按钮点击（品类、评级按钮）
      document.addEventListener('click', function(e) {
        if (e.target && e.target.tagName === 'BUTTON') {
          setTimeout(filterCustomCards, 100);
        }
      });
      
      const observer = new MutationObserver(init);
      observer.observe(document.getElementById('root'), { childList: true, subtree: true });

      // 「某代工烘焙食品」没有公开 logo：把占位块改成纯白，在白色卡片上等于隐形，
      // 同时保留 40px 占位，让标题与相邻卡片的左对齐位置保持一致。
      //
      //⚠️ 匹配标题时必须同时查 h2 和 h3：
      //    fixHeadingHierarchy() 会把卡片里的 h3 全部替换成 h2（补SEO 层级），
      //    早期这段只查 h3，结果 H2 修复上线后这里就静默失效了，
      //    灰色占位块一直露在外面。改这段前先确认标题标签实际是哪个。
      setInterval(function() {
        var cards = document.querySelectorAll('div.bg-white.rounded-2xl.border');
        for (var card of cards) {
          var title = card.querySelector('h2') || card.querySelector('h3');
          if (!title || !title.textContent.includes('某代工烘焙食品')) continue;

          var logoDiv = card.querySelector('.w-10.h-10.rounded-xl');
          if (!logoDiv || logoDiv.getAttribute('data-blank-logo') === '1') break;

          logoDiv.setAttribute('data-blank-logo', '1');
          logoDiv.textContent = '';                // 清掉占位字母
          logoDiv.style.background = 'transparent'; // 盖掉 bg-slate-100
          logoDiv.style.borderColor = 'transparent';// 盖掉 border-slate-200
          break;
        }
      }, 500);
    </script>
