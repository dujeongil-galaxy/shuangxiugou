        <h2 style="font-size:18px;font-weight:600;margin:24px 0 8px">常见问题</h2>
        <h3 style="font-size:15px;font-weight:600;margin:16px 0 4px">怎么查一家公司是不是双休？</h3>
        <p style="margin:0 0 12px">
          用浏览器打开本站并搜索公司名或品牌名即可查到该企业的「真实双休率」与「平均下班时间」。
          每条数据都附带证据来源与置信度标注——招聘平台自述属「招聘方口径」，
          劳动监察通报、裁判文书、上市公司 ESG 报告属高置信证据。
        </p>

        <h3 style="font-size:15px;font-weight:600;margin:16px 0 4px">双休率和「大小周」有什么区别？</h3>
        <p style="margin:0 0 12px">
          「双休」指每周能完整休满两天且不强制周末加班；「大小周」指单双周休、单数周休一天，
          一个月只多休 2 天。本站把大小周归为 B 级，单休归为 C 级。
          同一个品牌往往总部双休而门店或产线排班，判断时须注意适用范围。
        </p>

        <h3 style="font-size:15px;font-weight:600;margin:16px 0 4px">哪些公司是真正双休的？</h3>
        <p style="margin:0 0 12px">
          本站评级为 S 级与 A 级的企业属于制度层面落实周末双休、加班较少的类型，
          包括 Patagonia、IKEA、Microsoft、SAP、Apple、Sony、Volvo、Decathlon、迪卡侬、飞利浦、星巴克等。
          评级为 C 级的企业则存在严重超时或通报违约记录，购物与求职时建议避雷。
        </p>

        <h3 style="font-size:15px;font-weight:600;margin:16px 0 4px">平均下班时间是怎么统计的？</h3>
        <p style="margin:0 0 12px">
          取员工实际离岗点的众数，不是公司规定的下班时间。
          连锁门店取晚班打烊／交班点，不用门店营业时间冒充。
          标为「未核实」的表示该字段尚未核实，本站不填估算值。
        </p>

        <h3 style="font-size:15px;font-weight:600;margin:16px 0 4px">数据准不准？发现错了怎么办？</h3>
        <p style="margin:0 0 12px">
          本站数据均附公开证据链，来源可查可溯，但企业用工情况会随时间变化，
          且部分数据来自员工爆料等非官方渠道，不构成对任何企业的法律定性。
          如对该页数据有异议，欢迎通过
          <a href="https://github.com/dujeongil-galaxy/shuangxiugou/issues">GitHub Issues</a>
          提交，附上来源即可。
        </p>
        <p style="margin:0 0 12px;color:#6b7280;font-size:13px">
          ⚠️ 提交前请先<b>关闭 VPN / 代理</b>：GitHub 的人机验证与登录接口
          对代理 IP 触发限流时，会出现验证码无限循环、无法登录或页面空白，
          届时只能换网络重试。
        </p>

      // 替换所有指向原仓库的链接和按钮
      function replaceLinksAndButtons() {
        document.querySelectorAll('a').forEach(function(a) {
          if (a.href.includes('github.com/ZhiqingHeyi')) {
            a.href = a.href.replace('github.com/ZhiqingHeyi', 'github.com/dujeongil-galaxy');
          }
        });

        // 在「Star on GitHub」按钮右侧插入「赞助本项目」入口，跳站内 sponsor.html
        // 样式沿用 Star 按钮（bg-slate-900 → hover:bg-slate-800），视觉统一。
        // 用 data 标记做幂等，避免 MutationObserver 反复触发时重复插入。
        //
        var starBtn = null;
        document.querySelectorAll('a').forEach(function (a) {
          if (a.textContent.indexOf('Star on GitHub') >= 0) starBtn = a;
        });
        if (starBtn && !document.getElementById('sponsor-entry-btn')) {
          var s = document.createElement('a');
          s.id = 'sponsor-entry-btn';
          s.href = './sponsor.html';
          s.target = '_blank';
          s.rel = 'noopener noreferrer';
          s.className = starBtn.className;
          s.setAttribute('aria-label', '赞助本项目');
          s.textContent = '☕ 赞助本项目';
          // 换掉 Star 按钮的深色底，改用站点主色，与「提交爆料」区隔开。
          // ⚠️ 只能替换成本项目 CSS 里实际生成过的类名——assets 的 Tailwind 是
          // 按站点用到的样式裁剪过的，bg-emerald-700 等未使用的类并不存在，
          // 写了不生效，样式会退回 Star 按钮原本的黑色。
          s.className = s.className.replace(/bg-slate-9\d{2}/g, 'bg-emerald-600')
                                    .replace(/hover:bg-slate-8\d{2}/g, 'hover:bg-emerald-500');
          // 插到 Star 按钮之后（右侧），与「Star | 赞助」的阅读顺序一致
          starBtn.parentNode.insertBefore(s, starBtn.nextSibling);
        }


        // 拦截 bundle 里的原生按钮并改写为链接。
        //
        // 顶栏与页脚共用同一个链接：都指向 ticket.yml 工单表单（类型下拉 + 描述）。
        //
        // ⚠️ 不能删掉关键词，否则按钮仍是原生 button，点击无反应
        //   （bundle 里没有 href，是 index.html 的脚本在接管跳转）。
        var issueUrl = 'https://github.com/dujeongil-galaxy/shuangxiugou/issues';

        // 「提供数据」保留在数组里：bundle 是压缩产物，若将来回滚到旧版本，
        // 旧文案仍能被拦截（不匹配就只是按钮没反应，不会出错）。
        var keywords = ['提交爆料', '我来提供这家', '提交审核', '提供数据', '联系我们'];
        document.querySelectorAll('button').forEach(function(b) {
          // 已经是a标签就跳过
          if (b.tagName === 'A') return;
          for (var i = 0; i < keywords.length; i++) {
            if (b.textContent.indexOf(keywords[i]) >= 0) {
              var a = document.createElement('a');
              a.href = issueUrl;
              a.target = '_blank';
              a.rel = 'noopener noreferrer';
              a.className = b.className;
              // 顶栏按钮改名；页脚「联系我们」已是目标文案，不受影响
              a.textContent = b.textContent.replace('提交爆料 / 推荐', '提交数据 / 申诉');
              b.replaceWith(a);
              break;
            }
          }
        });

          // 图片缺失已降级为文字，跳过
          if (logoDiv.getAttribute('data-logo-fallback')) return;
          // 如果已经替换过了就跳过
          if (logoDiv.querySelector('img')) return;
          // 用logo里的短文字作为key匹配
          var brandShortName = logoDiv.textContent.trim();
          // 如果这个品牌有对应的logo
          if (brandLogos[brandShortName]) {
            // 清空原来的文字
            logoDiv.textContent = '';
            // 创建img标签
            var logoImg = document.createElement('img');
            logoImg.src = brandLogos[brandShortName];
            logoImg.alt = brandShortName;
            logoImg.className = 'w-full h-full object-cover rounded-lg';
            // 图片不存在时自动恢复显示品牌文字，避免出现破图
            logoImg.onerror = function() {
              if (logoDiv.getAttribute('data-logo-fallback')) return;
              logoDiv.setAttribute('data-logo-fallback', '1');
              logoDiv.textContent = brandShortName;
            };
            logoDiv.appendChild(logoImg);

            var valueEl = null;
            for (var j = 0; j < row.children.length; j++) {
              var c = row.children[j];
              if (c !== el && /font-mono/.test(c.className || '')) { valueEl = c; break; }
            }
            if (!valueEl) continue;
            if ((valueEl.textContent || '').trim() === SBUX_RATE_OVERRIDE) continue; // 幂等
            valueEl.textContent = SBUX_RATE_OVERRIDE;
          }
        }
      }

      // 自定义卡片的元数据（从配置自动生成，不用手动维护）
      var customCardsMeta = {};
      customCardsConfig.forEach(function(config) {
        customCardsMeta[config.id] = {
          keywords: config.keywords,
          category: config.category,
          grade: config.grade
        };
      });
      
      // 过滤自定义卡片，跟网站的搜索和筛选保持同步
      function filterCustomCards() {
        // 获取当前搜索关键词
        var searchInput = document.getElementById('site-search-input');
        var keyword = searchInput ? searchInput.value.trim().toLowerCase() : '';
        
        // 获取当前选中的品类按钮（高亮的那个）
        var activeCategory = '全部';
        var categoryBtns = document.querySelectorAll('button');
        categoryBtns.forEach(function(btn) {
          var text = btn.textContent.trim();
          if (['全部', '数码外设', '数码3C', '户外服饰', '个人护理', '运动器材', '零食饮料', '汽车用品', '互联网软件', '家电数码', '物流服务', '汽车生活', '食品饮品', '互联网服务', '服装饰品'].includes(text)) {
            // 判断是不是选中状态（通常是背景色变深）
            if (btn.className.includes('bg-emerald') || btn.className.includes('bg-black') || btn.className.includes('bg-gray-900')) {
              activeCategory = text;
            }
          }
        });
        
        // 获取当前选中的评级
        // ⚠️ 选中态类名是 bg-slate-900（bundle 渲染），早先只查 bg-black/bg-gray-900
        // → 永远匹配不上，自定义卡的评级筛选静默失效（2026-10-18 修复）。
        // 「待核实」是 stat-filter.js 注入评级行的 U 按钮，选中时同样带 bg-slate-900。
        var activeGrade = '全部评级';
        categoryBtns.forEach(function(btn) {
          var text = btn.textContent.trim();
          if (['全部评级', 'S 级', 'A 级', 'B 级', 'C 级', '待核实'].includes(text)) {
            if (btn.className.includes('bg-black') || btn.className.includes('bg-gray-900') || btn.className.includes('bg-slate-900')) {
              activeGrade = text;
            }
          }
        });
        
        // 遍历所有自定义卡片，判断显示还是隐藏
        Object.keys(customCardsMeta).forEach(function(cardId) {
          var card = document.getElementById(cardId);
          if (!card) return;
          
          var meta = customCardsMeta[cardId];
          var shouldShow = true;
          
          // 1. 检查搜索关键词
          if (keyword) {
            var matchKeyword = meta.keywords.some(function(k) {
              return k.toLowerCase().includes(keyword);
            });
            if (!matchKeyword) shouldShow = false;
          }
          
          // 2. 检查品类筛选
          if (activeCategory !== '全部') {
            if (meta.category !== activeCategory) shouldShow = false;
          }
          
          // 3. 检查评级筛选
          if (activeGrade !== '全部评级') {
            var gradeShort = activeGrade.replace(' ', ''); // "S 级" -> "S级"
            if (meta.grade !== gradeShort) shouldShow = false;
          }
          
          // 显示或隐藏
          card.style.display = shouldShow ? '' : 'none';
        });
      }
      
      // 立刻试一次，不行就监听页面变化
      // 给主搜索框打稳定 id。
      //
      // ⚠️ 为什么不用 placeholder 定位：早先filterCustomCards() 用
      //  找输入框，但后来把 placeholder 改成了
      // 「消费前，先了解这个品牌是否双休……」——里面没有「搜索」二字，
      // 选择器直接返回 null，keyword 恒为空，过滤静默失效（用户实测搜任何词都出全部）。
      // placeholder 是**文案**，会被人改；id 才是**契约**。
      function tagSearchInput() {
        var el = document.querySelector('main input[type="text"]')
               || document.getElementById('site-search-input');
        if (el && !el.id) el.id = 'site-search-input';
      }

      function init() {
        tagSearchInput();
        replaceLinksAndButtons();
        insertAllCustomCards();
        replaceAllLogos();
        insertAppleNote();
        insertStarbucksNote();
        insertMeiyijiaNote();
        patchStarbucksRate();
        filterCustomCards();
        scheduleHeadingFix();
      }
      init();

      // SEO：补齐缺失的 H2 层级（页面只有 1 个 H1 + 36 个 H3，中间无 H2）
      // 品牌名卡片是 H1 下的同级并列内容，语义上应为 H2。
      //
      // 安全要点（曾在此处翻车过，务必保留）：
      // 1. 用 requestAnimationFrame 脱离 MutationObserver 回调栈，
      //    否则在 observer 触发的同步执行中替换节点会与之互相干扰。
      // 2. 每个卡片用 data 属性做幂等标记，重复触发不会重复插入。
      // 3. 只在 h3 的直接父节点上做替换，不移动/重排任何其他节点。
      // 4. 保留原 className，外观零变化（卡片 h3 的 class 全是 Tailwind 工具类）。
      var headingFixScheduled = false;
      function scheduleHeadingFix() {
        if (headingFixScheduled) return;
        headingFixScheduled = true;
        requestAnimationFrame(function() {
          headingFixScheduled = false;
          // 不要静默吞掉异常：记录到控制台，页面本身仍不受影响
          try { fixHeadingHierarchy(); } catch (e) { diagError('fixHeadingHierarchy 抛异常', e); }
        });
      }

      function fixHeadingHierarchy() {
        var root = document.getElementById('root');
        if (!root) { diagError('fixHeadingHierarchy 找不到 #root'); return; }
        var cards = root.querySelectorAll('div.bg-white.rounded-2xl.border');
        for (var i = 0; i < cards.length; i++) {
          var card = cards[i];
          if (card.getAttribute('data-h2-checked') === '1') continue;
          // 已存在被我们改过的 h2，说明处理过了，别重复
          if (card.querySelector('h2[data-h2-fixed]')) {
            card.setAttribute('data-h2-checked', '1');
            continue;
          }
          var h3 = card.querySelector('h3');
          if (!h3) {
            // 找不到 h3 时不能直接标记「已检查」——若这张卡的标题已被别的逻辑
            // 改成 h2 但没打 data-h2-fixed 标记，标记后就再也不会重试了，
            // 属于不可恢复的静默失效。这里只告警，不标记。
            diagWarn('卡片既无 h3 也无已标记的 h2，跳过（不标记 data-h2-checked）');
            continue;
          }
          if (!h3.parentNode) {
            diagWarn('h3 脱离文档（parentNode 为空），跳过且不标记');
            continue;
          }
          var h2 = document.createElement('h2');
          h2.innerHTML = h3.innerHTML;
          h2.className = h3.className;      // 样式完全沿用
          h2.setAttribute('data-h2-fixed', '1');
          h3.parentNode.replaceChild(h2, h3);
          card.setAttribute('data-h2-checked', '1');
        }
      }
      
      // 监听搜索框输入
      document.addEventListener('input', function(e) {
        if (e.target && e.target.id === 'site-search-input') {
          filterCustomCards();
          // 搜索会改变卡片列表，注入的节点必须跟着重新定位
          // （否则苹果卡被过滤掉后，富士康说明会留在原地那张卡上）
          requestAnimationFrame(function() {
            try { insertAppleNote(); } catch (err) { diagError('insertAppleNote 抛异常', err); }
            try { insertStarbucksNote(); } catch (err) { diagError('insertStarbucksNote 抛异常', err); }
            try { insertMeiyijiaNote(); } catch (err) { diagError('insertMeiyijiaNote 抛异常', err); }
            try { patchStarbucksRate(); } catch (err) { diagError('patchStarbucksRate 抛异常', err); }
          });
        }
      });

      // 监听所有按钮点击（品类、评级按钮）
      document.addEventListener('click', function(e) {
        if (e.target && e.target.tagName === 'BUTTON') {
          setTimeout(function() {
            filterCustomCards();
            try { insertAppleNote(); } catch (err) { diagError('insertAppleNote 抛异常', err); }
            try { insertStarbucksNote(); } catch (err) { diagError('insertStarbucksNote 抛异常', err); }
            try { insertMeiyijiaNote(); } catch (err) { diagError('insertMeiyijiaNote 抛异常', err); }
            try { patchStarbucksRate(); } catch (err) { diagError('patchStarbucksRate 抛异常', err); }
          }, 100);
        }
      });
      
      const observer = new MutationObserver(init);
      observer.observe(document.getElementById('root'), { childList: true, subtree: true });

      // 「某代工烘焙食品」没有公开 logo：把占位块改成纯白，在白色卡片上等于隐形，
      // 同时保留 40px 占位，让标题与相邻卡片的左对齐位置保持一致。
      //
      //⚠️ 匹配标题时必须同时查 h2 和 h3：
      //    fixHeadingHierarchy() 会把卡片里的 h3 全部替换成 h2（补SEO 层级），
      //    早期这段只查 h3，结果 H2 修复上线后这里就静默失效了，
      //    灰色占位块一直露在外面。改这段前先确认标题标签实际是哪个。
      setInterval(function() {
        var cards = document.querySelectorAll('div.bg-white.rounded-2xl.border');
        for (var card of cards) {
          var title = card.querySelector('h2') || card.querySelector('h3');
          if (!title || !title.textContent.includes('某代工烘焙食品')) continue;

          var logoDiv = card.querySelector('.w-10.h-10.rounded-xl');
          if (!logoDiv || logoDiv.getAttribute('data-blank-logo') === '1') break;

          logoDiv.setAttribute('data-blank-logo', '1');
          logoDiv.textContent = '';                // 清掉占位字母
          logoDiv.style.background = 'transparent'; // 盖掉 bg-slate-100
          logoDiv.style.borderColor = 'transparent';// 盖掉 border-slate-200
          break;
        }
      }, 500);
