<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>双休购 · ShuangxiuGo | 用订单反向考核企业良心</title>
    <meta
      name="description"
      content="双休购是开源的劳工友好品牌索引与网购透镜：汇聚公开司法裁判、劳动监察通报与众包证据，买东西前查一眼，支持真正双休的良心企业，避开单休血汗工厂。"
    />
    <meta property="og:title" content="双休购 · 用每一次下单，支持真正双休的良心企业" />
    <meta
      property="og:description"
      content="把老板考核你的 KPI，变成打工人考核老板的货币选票。开源劳工友好品牌索引与浏览器网购透镜。"
    />
    <meta property="og:type" content="website" />
    <script type="module" crossorigin src="./assets/index-YthXZ9eP.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BgVofs0W.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 替换所有指向原仓库的链接和按钮
      function replaceLinksAndButtons() {
        document.querySelectorAll('a').forEach(function(a) {
          if (a.href.includes('github.com/ZhiqingHeyi')) {
            a.href = a.href.replace('github.com/ZhiqingHeyi', 'github.com/dujeongil-galaxy');
          }
        });

        // 提交爆料/提供数据 按钮跳转到 issues 新建页面，预填表单
        var issueTitle = encodeURIComponent('推荐双休品牌 / 提交工时爆料');
        var issueBody = encodeURIComponent(
'数据全部依托 GitHub 开源仓库进行公证式治理。你可以通过下方表单提交线索，或直接前往 GitHub 发起 Pull Request。\n\n' +
'品牌名称 / 常见商品：\n' +
'例如：某个洗发水品牌、键盘品牌\n\n' +
'所属母公司主体（选填）：\n' +
'例如：企查查/天眼查可搜到的企业全称\n\n' +
'工时与休假实情（三选一）：\n' +
'✅ 严格双休 / 极少加班 (值得推荐)\n' +
'⚠️ 大小周 / 有偿加班\n' +
'❌ 单休 / 严重超时加班 (提醒避雷)\n\n' +
'佐证材料（脱敏截图链接/通报文号/新闻来源）：\n' +
'提供可信公开线索，例如官方通报链接、裁判文书号或员工社区交叉讨论地址'
        );
        var issueUrl = 'https://github.com/dujeongil-galaxy/shuangxiugou/issues/new?title=' + issueTitle + '&body=' + issueBody;

        var keywords = ['提交爆料', '我来提供这家', '提交审核', '提供数据'];
        document.querySelectorAll('button').forEach(function(b) {
          // 已经是a标签就跳过
          if (b.tagName === 'A') return;
          for (var i = 0; i < keywords.length; i++) {
            if (b.textContent.indexOf(keywords[i]) >= 0) {
              var a = document.createElement('a');
              a.href = issueUrl;
              a.target = '_blank';
              a.className = b.className;
              a.textContent = b.textContent;
              b.replaceWith(a);
              break;
            }
          }
        });
      }

      // 品牌logo映射表
      var brandLogos = {
        'IKEA': './assets/ikea.png',
        '蜂花': './assets/fenghua.png',
        '迪卡侬': './assets/decathlon.png',
        '飞利浦': './assets/philips.png',
        '百事': './assets/pepsi.png',
        'vivo': './assets/vivo.png',
        '海尔': './assets/haier.png',
        '农夫': './assets/nongfu.png',
        '立白': './assets/liby.png',
        '顺丰': './assets/sf.png',
        'PDD': './assets/pdd.png',
        '康师傅': './assets/kangshifu.png',
        'BYD': './assets/byd.png',
        'VOLVO': './assets/volvo.png',
        'HUAWEI': './assets/huawei.png',
        'APPLE': './assets/apple.png',
        'SONY': './assets/sony.png',
        '瑞幸': './assets/luckin.png',
        '星巴克': './assets/starbucks.svg',
        '腾讯': './assets/tencent.png',
        '美团': './assets/meituan.png',
        'UNIQLO': './assets/uniqlo.png',
        'TNF': './assets/tnf.png',
        'MSFT': './assets/microsoft.png',
        'SAP': './assets/sap.png',
        '有道': './assets/youdao.png',
        'OSRAM': './assets/osram.png',
        'LOGI': './assets/logi.png',
        '赵一鸣/零食很忙': './assets/snack-logo.png',
        'PTG': './assets/patagonia.png',
        '星宇': './assets/xingyu.png'
      };

      // 替换所有卡片的logo
      function replaceAllLogos() {
        var cards = document.querySelectorAll('div.bg-white.rounded-2xl.border');
        cards.forEach(function(card) {
          // 找到logo div
          var logoDiv = card.querySelector('.w-10.h-10.rounded-xl.bg-slate-100');
          if (!logoDiv) return;
          // 如果已经替换过了就跳过
          if (logoDiv.querySelector('img')) return;
          // 用logo里的短文字作为key匹配
          var brandShortName = logoDiv.textContent.trim();
          // 如果这个品牌有对应的logo
          if (brandLogos[brandShortName]) {
            // 清空原来的文字
            logoDiv.textContent = '';
            // 创建img标签
            var logoImg = document.createElement('img');
            logoImg.src = brandLogos[brandShortName];
            logoImg.alt = brandShortName;
            logoImg.className = 'w-full h-full object-cover rounded-lg';
            logoDiv.appendChild(logoImg);
          }
        });
      }

      // 自动监听页面渲染，一旦找到C级红色卡片直接复制它的框架，改文字后插入
      function insertSnackCard() {
        if (document.querySelector('#snack-card')) return;
        
        var cards = document.querySelectorAll('div.bg-white.rounded-2xl.border');
        var cCard = null;
        var ikeaCard = null;
        cards.forEach(function(card) {
          if (card.textContent.includes('C级') && card.textContent.includes('避雷预警')) {
            cCard = card;
          }
          if (card.textContent.includes('IKEA') || card.textContent.includes('宜家')) {
            ikeaCard = card;
          }
        });
        
        if (cCard && ikeaCard) {
          // 直接复制现成C级红色卡片的整个DOM框架，所有样式全对
          var snackCard = cCard.cloneNode(true);
          snackCard.id = 'snack-card';
          
          // 只改文字内容，框架完全保留，不用自己调样式
          // 改品牌名
          snackCard.querySelector('h3').textContent = '赵一鸣/零食很忙';
          // 改公司名
          snackCard.querySelectorAll('p')[0].textContent = '湖南鸣鸣很忙商业连锁有限公司';
          // 改logo为图片
          var logoDiv = snackCard.querySelector('.w-10');
          logoDiv.textContent = '';
          var logoImg = document.createElement('img');
          logoImg.src = './assets/snack-logo.png';
          logoImg.alt = '零食很忙';
          logoImg.className = 'w-full h-full object-cover rounded-lg';
          logoDiv.appendChild(logoImg);
          // 改工时政策
          var infoRows = snackCard.querySelectorAll('.bg-slate-50 > div');
          infoRows[0].querySelectorAll('span')[1].textContent = '月休3-4天 / 门店两班倒';
          infoRows[1].querySelectorAll('span')[1].textContent = '节假日加班常见 / 连续站立8-10小时';
          // 改员工指数部分
          var stats = snackCard.querySelectorAll('.bg-slate-900 .grid div div');
          stats[1].textContent = '未知';
          stats[3].textContent = '19:30';
          // 改投票数
          stats[0].textContent = '0';
          // 改描述
          snackCard.querySelector('.bg-slate-900 .italic').textContent = '"门店实行早晚班轮换，日均工作8-10小时，月休3-4天，节假日加班常见，一线员工需连续站立作业"';
          // 改标签
          var tags = snackCard.querySelectorAll('.flex-wrap span');
          tags[0].textContent = '零食量贩';
          tags[1].textContent = '赵一鸣零食';
          tags[2].textContent = '连锁门店';
          // 改点赞点踩数
          var voteBtns = snackCard.querySelectorAll('.flex.items-center.gap-2 button span');
          if (voteBtns[0]) voteBtns[0].textContent = '0';
          if (voteBtns[1]) voteBtns[1].textContent = '0';
          // 改员工投票数
          var voteCount = snackCard.querySelector('.bg-slate-900 .font-mono');
          if (voteCount) voteCount.textContent = '0 人已投票';
          // 整个推荐块改成红色警示文字
          var recommendBlock = null;
          var allDivs = snackCard.querySelectorAll('div');
          allDivs.forEach(function(div) {
            if (div.textContent.includes('打工人推荐双休平替')) {
              recommendBlock = div;
            }
          });
          if (recommendBlock) {
            recommendBlock.innerHTML = '<div style="color:#dc2626;font-weight:900;font-size:14px;">⚠️ 部分门店月休仅2天</div>';
            recommendBlock.className = recommendBlock.className.replace(/border-emerald-200/g, 'border-red-200');
            recommendBlock.className = recommendBlock.className.replace(/bg-emerald-50/g, 'bg-red-50');
          }
          
          // 把新卡片插到 IKEA 后面
          ikeaCard.parentNode.insertBefore(snackCard, ikeaCard.nextSibling);
        }
      }
      
      // 立刻试一次，不行就监听页面变化
      function init() {
        replaceLinksAndButtons();
        insertSnackCard();
        replaceAllLogos();
      }
      init();
      const observer = new MutationObserver(init);
      observer.observe(document.getElementById('root'), { childList: true, subtree: true });
    </script>
  </body>
</html>
