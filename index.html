<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>双休购 · ShuangxiuGo | 用订单反向考核企业良心</title>
    <meta
      name="description"
      content="双休购是开源的劳工友好品牌索引与网购透镜：汇聚公开司法裁判、劳动监察通报与众包证据，买东西前查一眼，支持真正双休的良心企业，避开单休血汗工厂。"
    />
    <meta property="og:title" content="双休购 · 用每一次下单，支持真正双休的良心企业" />
    <meta
      property="og:description"
      content="把老板考核你的 KPI，变成打工人考核老板的货币选票。开源劳工友好品牌索引与浏览器网购透镜。"
    />
    <meta property="og:type" content="website" />
    <script type="module" crossorigin src="./assets/index-YthXZ9eP.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BgVofs0W.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      setTimeout(function() {
        // 所有指向原仓库的链接都改成自己的仓库
        document.querySelectorAll('a').forEach(function(a) {
          if (a.href.includes('github.com/ZhiqingHeyi/shuangxiugou')) {
            a.href = a.href.replace('github.com/ZhiqingHeyi/shuangxiugou', 'github.com/dujeongil-galaxy/shuangxiugou');
          }
        });

        // 提交爆料/提供数据 按钮跳转到 issues 新建页面，预填表单
        var issueTitle = encodeURIComponent('推荐双休品牌 / 提交工时爆料');
        var issueBody = encodeURIComponent(
'数据全部依托 GitHub 开源仓库进行公证式治理。你可以通过下方表单提交线索，或直接前往 GitHub 发起 Pull Request。\n\n' +
'品牌名称 / 常见商品：\n' +
'例如：某个洗发水品牌、键盘品牌\n\n' +
'所属母公司主体（选填）：\n' +
'例如：企查查/天眼查可搜到的企业全称\n\n' +
'工时与休假实情（三选一）：\n' +
'✅ 严格双休 / 极少加班 (值得推荐)\n' +
'⚠️ 大小周 / 有偿加班\n' +
'❌ 单休 / 严重超时加班 (提醒避雷)\n\n' +
'佐证材料（脱敏截图链接/通报文号/新闻来源）：\n' +
'提供可信公开线索，例如官方通报链接、裁判文书号或员工社区交叉讨论地址'
        );
        var issueUrl = 'https://github.com/dujeongil-galaxy/shuangxiugou/issues/new?title=' + issueTitle + '&body=' + issueBody;

        var keywords = ['提交爆料', '我来提供这家', '提交审核', '提供数据'];
        document.querySelectorAll('button').forEach(function(b) {
          for (var i = 0; i < keywords.length; i++) {
            if (b.textContent.indexOf(keywords[i]) >= 0) {
              var a = document.createElement('a');
              a.href = issueUrl;
              a.target = '_blank';
              a.className = b.className;
              a.textContent = b.textContent;
              b.replaceWith(a);
              break;
            }
          }
        });

        // 替换虚拟烘焙食品卡片为零食很忙
        document.querySelectorAll('div').forEach(function(el) {
          if (el.textContent.includes('某代工烘焙食品') && el.querySelector('h3, h2, [class*="text-xl"], [class*="text-lg"]')) {
            var card = el;
            // 找最近的卡片容器
            while (card.parentElement && !card.className.includes('rounded-2xl')) {
              card = card.parentElement;
            }

            // 替换品牌名
            card.innerHTML = card.innerHTML.replace(/某代工烘焙食品[^<]*/g, '零食很忙');
            // 替换公司名
            card.innerHTML = card.innerHTML.replace(/某代工食品有限公司/g, '湖南鸣鸣很忙商业连锁有限公司（旗下赵一鸣零食）');
            // 替换评级标签
            card.innerHTML = card.innerHTML.replace(/[A-C]级[·\s][^<]*/g, 'C级·避雷预警');
            // 替换工时政策
            card.innerHTML = card.innerHTML.replace(/工时政策：[\s\S]*?加班对待：/g, '工时政策：月休2天 / 连锁门店两班倒<br>加班对待：');
            // 替换真实双休率
            card.innerHTML = card.innerHTML.replace(/真实双休率：[\s\S]*?\d+%/g, '真实双休率：0%');
            // 替换平均下班时间
            card.innerHTML = card.innerHTML.replace(/平均离岗\/下班：[\s\S]*?\d+:\d+/g, '平均离岗/下班：门店轮班制');
            // 替换底部描述
            card.innerHTML = card.innerHTML.replace(/"[^"]*代工[^"]*"/g, '"连锁门店多为两班倒，日均工作8-10小时，月休2-4天，员工普遍反映加班无补偿、一人多岗"');
          }
        });
      }, 1500);
    </script>
  </body>
</html>
