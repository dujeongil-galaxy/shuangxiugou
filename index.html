  <body>
    <div id="root"></div>
    <script>
      setTimeout(function() {
        // 所有指向原仓库的链接都改成自己的仓库
        document.querySelectorAll('a').forEach(function(a) {
          if (a.href.includes('github.com/ZhiqingHeyi/shuangxiugou')) {
            a.href = a.href.replace('github.com/ZhiqingHeyi/shuangxiugou', 'github.com/dujeongil-galaxy/shuangxiugou');
          }
        });

        // 提交爆料/提供数据 按钮跳转到 issues 新建页面，预填表单
        var issueTitle = encodeURIComponent('推荐双休品牌 / 提交工时爆料');
        var issueBody = encodeURIComponent(
'数据全部依托 GitHub 开源仓库进行公证式治理。你可以通过下方表单提交线索，或直接前往 GitHub 发起 Pull Request。\n\n' +
'品牌名称 / 常见商品：\n' +
'例如：某个洗发水品牌、键盘品牌\n\n' +
'所属母公司主体（选填）：\n' +
'例如：企查查/天眼查可搜到的企业全称\n\n' +
'工时与休假实情（三选一）：\n' +
'✅ 严格双休 / 极少加班 (值得推荐)\n' +
'⚠️ 大小周 / 有偿加班\n' +
'❌ 单休 / 严重超时加班 (提醒避雷)\n\n' +
'佐证材料（脱敏截图链接/通报文号/新闻来源）：\n' +
'提供可信公开线索，例如官方通报链接、裁判文书号或员工社区交叉讨论地址'
        );
        var issueUrl = 'https://github.com/dujeongil-galaxy/shuangxiugou/issues/new?title=' + issueTitle + '&body=' + issueBody;

        var keywords = ['提交爆料', '我来提供这家', '提交审核', '提供数据'];
        document.querySelectorAll('button').forEach(function(b) {
          for (var i = 0; i < keywords.length; i++) {
            if (b.textContent.indexOf(keywords[i]) >= 0) {
              var a = document.createElement('a');
              a.href = issueUrl;
              a.target = '_blank';
              a.className = b.className;
              a.textContent = b.textContent;
              b.replaceWith(a);
              break;
            }
          }
        });
      }, 1500);

                      <p class="text-xs text-slate-400 truncate max-w-[180px]">湖南鸣鸣很忙商业连锁有限公司</p>
                    </div>

                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-triangle-alert w-3.5 h-3.5 text-rose-600" aria-hidden="true">
                      <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path>
                      <path d="M12 9v4"></path>
                      <path d="M12 17h.01"></path>
                    </svg>
                    C级·避雷预警
                  </span>
                </div>
                <div class="bg-slate-50 rounded-xl p-2.5 border border-slate-100 text-xs space-y-1.5">
                  <div class="flex items-center justify-between text-slate-700">
                    <span class="text-slate-400">工时政策：月休2天 / 连锁门店两班倒<br>加班对待：</span>
                    <span class="font-semibold">加班无补偿 / 一人多岗</span>
                  </div>
                </div>
                <div class="bg-slate-900 text-slate-100 rounded-xl p-3 text-xs space-y-2 border border-slate-800 shadow-inner">

                        <path d="m16 11 2 2 4-4"></path>
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                      </svg>
                      内部员工实测指数
                    </span>
                    <span class="text-slate-400">0 人已投票</span>
                  </div>
                  <div class="flex items-center justify-between pt-1">
                    <div>
                      <div class="text-[10px] text-slate-400 mb-0.5">真实双休率：</div>
                      <div class="font-mono font-bold text-sm text-rose-400">0%</div>
                    </div>
                    <div class="text-right">
                      <div class="text-[10px] text-slate-400 mb-0.5">平均离岗/下班：</div>
                      <div class="font-mono font-bold text-sm text-slate-200">21:30</div>
                    </div>
                  </div>
                  <p class="pt-1 text-[11px] text-slate-400 italic line-clamp-1 border-t border-slate-800">
