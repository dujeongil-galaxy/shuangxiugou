<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="双休购劳动法小助手">
  <!-- 二次元卡通风格：大眼、呆毛、腮红、猫耳 -->
  <!-- 脸：圆形，肤色 -->
  <circle cx="32" cy="34" r="22" fill="#FFE4C4"/>
  <!-- 猫耳：左右各一 -->
  <path d="M14 20 L18 8 L24 18 Z" fill="#FFE4C4" stroke="#E8C9A8" stroke-width="1"/>
  <path d="M50 20 L46 8 L40 18 Z" fill="#FFE4C4" stroke="#E8C9A8" stroke-width="1"/>
  <path d="M16 18 L19 11 L22 17" fill="#FFB6C1" opacity="0.6"/>
  <path d="M48 18 L45 11 L42 17" fill="#FFB6C1" opacity="0.6"/>
  <!-- 头发：teal 主色，刘海 -->
  <path d="M12 32 Q12 14 32 12 Q52 14 52 32 L50 28 Q48 18 32 16 Q16 18 14 28 Z" fill="#0F766E"/>
  <!-- 呆毛：头顶翘起 -->
  <path d="M32 12 Q30 6 34 4 Q36 8 32 12" fill="#0F766E"/>
  <!-- 眼睛：二次元大眼 -->
  <ellipse cx="24" cy="34" rx="5" ry="6" fill="#fff"/>
  <ellipse cx="40" cy="34" rx="5" ry="6" fill="#fff"/>
  <ellipse cx="24" cy="35" rx="4" ry="5" fill="#134E4A"/>
  <ellipse cx="40" cy="35" rx="4" ry="5" fill="#134E4A"/>
  <!-- 眼睛高光 -->
  <circle cx="25.5" cy="33" r="1.8" fill="#fff"/>
  <circle cx="41.5" cy="33" r="1.8" fill="#fff"/>
  <circle cx="23" cy="36" r="1" fill="#5EEAD4" opacity="0.8"/>
  <circle cx="39" cy="36" r="1" fill="#5EEAD4" opacity="0.8"/>
  <!-- 腮红：粉色圆 -->
  <ellipse cx="18" cy="40" rx="3" ry="2.5" fill="#FFB6C1" opacity="0.5"/>
  <ellipse cx="46" cy="40" rx="3" ry="2.5" fill="#FFB6C1" opacity="0.5"/>
  <!-- 嘴：微笑弧线 -->
  <path d="M28 44 Q32 47 36 44" stroke="#D97706" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- 身体：小领结 -->
  <path d="M28 54 L32 56 L36 54 L32 52 Z" fill="#5EEAD4"/>
  <circle cx="32" cy="54" r="1.5" fill="#0F766E"/>
</svg>
