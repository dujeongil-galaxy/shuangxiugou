<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="星巴克 官方App下载 点击前往腾讯应用宝 公益广告位">
<!--
  广告位第 3 张：星巴克官方 App 下载广告（站点自绘矢量稿，非站长提供的图片素材）。
  站长 2026-11-28 指令（原话）：「新增一个星巴克的，挂一下腾讯应用宝的星巴克 App
  下载页面。学 AD1 陆喜依，需要明确告知用户，点击会跳转到哪里，不要做那种一声不吭的。」

  落地页：腾讯应用宝（sj.qq.com）上的星巴克 App 官方下载详情页，开发者为
  星巴克企业管理（中国）有限公司，零参数裸链接。

  视觉语言与另外三张两两互异（verify §36a 反向断言）：
    第 1 张 陆喜依 = 深蓝渐变 + 金色圆印章 + 同心弧 + 聚光（正式、隆重）
    第 2 张 胖东来 = 砖红纯色 + 米白「运单/号外」横条 + 橙色装订边 + 粗报头线
    第 3 张 本稿   = 星巴克绿纯色 + 白色手机轮廓 + 下载箭头 + 白色胶囊 CTA
                     （App 下载、工具感，不与另三套混）
    第 4 张 招商   = 暖白纸面 + 细网格 + 虚线空位框 + 描边大字 + VACANCY 方章

  刻意不用：任何渐变（linearGradient/radialGradient）、金色 #f9df8b/#e5a336、
  深蓝 #0a1b47/#1d3f9e、砖红 #8f3325、米白 #f7efe0、暖白 #fbf7ee、
  虚线框 / VACANCY 方章 / 圆印章 / 同心弧 / 聚光 / 菱形织带 / 网格 / 斜网纹。
  defs 一律 sbx- 前缀（starbucks），与 lx- / nd- / rw- 不共用。

  文案全部画进 <text>，三条主文案基线严格递增（140 → 192 → 230），
  与图同坐标系同缩放，结构上不可能叠字/穿模；不含任何 URL 与外链。
  「点击会跳到哪里」写进图里（CTA 下方一行白字），不是靠 aria-label 藏着。
-->
<rect width="1200" height="300" fill="#0a3d2c"/>

<!-- 右侧深一档绿块，给 CTA 区做托底（纯色，不是渐变） -->
<rect x="812" y="0" width="388" height="300" fill="#0f4a36"/>

<!-- 上下两条细白线，克制不抢文案 -->
<rect x="0" y="14" width="1200" height="2" fill="#ffffff" opacity="0.22"/>
<rect x="0" y="284" width="1200" height="2" fill="#ffffff" opacity="0.22"/>

<!-- 左侧白色手机轮廓 + 下载箭头（App 下载意象；圆角矩形，不是圆印章也不是方章） -->
<g transform="translate(118,150)">
  <rect x="-46" y="-76" width="92" height="152" rx="14" fill="none" stroke="#eaf3ee" stroke-width="4"/>
  <path d="M0 -44 V20" fill="none" stroke="#eaf3ee" stroke-width="6" stroke-linecap="round"/>
  <path d="M-16 4 L0 22 L16 4" fill="none" stroke="#eaf3ee" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="-26" y="42" width="52" height="5" rx="2.5" fill="#eaf3ee"/>
</g>

<!-- 三条主文案（全部画进图里，基线严格递增 140 → 192 → 230） -->
<text x="210" y="140" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="84" font-weight="700" fill="#ffffff" letter-spacing="6">星巴克</text>
<text x="212" y="192" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="26" fill="#cfe8dc" letter-spacing="1">星巴克中国 · 官方 App 下载</text>
<text x="212" y="230" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18" fill="#9dc9b4" letter-spacing="1">A 级 · 真实双休率 98% · 官方应用宝页面</text>

<!-- CTA 胶囊：白色，指向腾讯应用宝下载页 -->
<g>
  <rect x="836" y="94" width="340" height="66" rx="33" fill="#ffffff"/>
  <text x="1006" y="135" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="21" font-weight="700" fill="#0a3d2c">去腾讯应用宝下载 App →</text>
</g>

<!-- 「点击会跳到哪里」明写在图里（不靠 aria-label 藏着） -->
<text x="1006" y="196" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15" fill="#cfe8dc" letter-spacing="0.5">点击将在新标签页打开腾讯应用宝下载页</text>

<!-- 刊头（y=42）与页脚（y=268）都避开主线基线区间 -->
<text x="1120" y="42" text-anchor="end" font-family="Arial,sans-serif" font-size="15" fill="#cfe8dc" letter-spacing="4">PUBLIC WELFARE AD · 03 / 04</text>
<text x="1120" y="268" text-anchor="end" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15" fill="#9dc9b4" letter-spacing="2">公益广告位 · 星巴克 App 下载</text>
</svg>
