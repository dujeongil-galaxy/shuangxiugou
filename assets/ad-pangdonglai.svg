<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="胖东来 善待劳动者 货车司机送货也能体会到尊重 公益广告位">
<!--
  广告位第 2 张：胖东来广告卡的**广告设计图**（站点自绘矢量稿，非站长提供的图片素材）。
  站长 2026-11-11 00:46 指令（原话）：「胖东来的广告先改了吧，第一张也不要和第二张
  广告使用同一种风格」——此前第 1/2 张共用「深蓝渐变 + 金挂牌 + 圆印章 + 同心弧 +
  聚光」的正式稿，第 3 张招商稿已是暖白纸面告示稿。本稿因此换成**第三套**视觉语言：

    第 1 张 陆喜依 = 深蓝渐变底 + 金色徽章/挂牌 + 圆印章 + 同心弧 + 顶部聚光（隆重）
    第 2 张 胖东来 = 砖红纯色底 + 米白「运单/号外」横条 + 装订橙条 + 粗报头线
                     + 侧栏粗横杠（纪实、朴素、像一张送货单）  ← 本稿
    第 3 张 招商   = 暖白纸面 + 细网格 + 虚线空位框 + 描边大字 + VACANCY 方章（留白）

  刻意不用的东西：任何渐变、金色、深蓝、圆印章、同心弧、聚光、菱形织带；
  也不碰招商稿的网格 / 虚线框 / 描边字 / 方章 / 加号圆。defs 一律 nd- 前缀
  （news dispatch），与 lx- / rw- 不共用。verify §36a 有「三稿两两互异」反向断言：
  本稿出现另两套任一特征即判红。

  文案仍然全部画进 <text>，三条主文案基线严格递增（140 → 192 → 230），
  与图同坐标系同缩放，结构上不可能叠字/穿模；其余刊头/页脚文字一律放到
  y<100 或 y>260，不混进主线基线。不含任何 URL 与外链。
  站长 2026-11-10 晚的两条信息一条不少：劳动者态度（货车司机送货，也能体会到
  尊重）+ 挂上广告位的原因（善待劳动者，正是它登上公益广告位的原因），
  「备注」两字按 19:48 指令不出现。
-->
<defs>
  <pattern id="nd-ink" width="16" height="16" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="1.1" fill="#f7efe0" opacity="0.10"/>
  </pattern>
</defs>

<!-- 砖红纯色满幅：零渐变、零聚光、零同心弧 -->
<rect width="1200" height="300" fill="#8f3325"/>
<rect width="1200" height="300" fill="url(#nd-ink)"/>

<!-- 上下两条粗报头线（报纸号外感，不是斜线网纹带） -->
<rect x="0" y="16" width="1200" height="7" fill="#f7efe0"/>
<rect x="0" y="277" width="1200" height="7" fill="#f7efe0"/>

<!-- 左右侧栏：三道米白粗横杠，纯几何，不像圆印章也不像加号空位 -->
<g fill="#f7efe0" opacity="0.88">
  <rect x="28" y="88" width="72" height="8"/>
  <rect x="28" y="146" width="72" height="8"/>
  <rect x="28" y="204" width="72" height="8"/>
  <rect x="1100" y="88" width="72" height="8"/>
  <rect x="1100" y="146" width="72" height="8"/>
  <rect x="1100" y="204" width="72" height="8"/>
</g>

<!-- 中央「运单纸」：米白横向圆角条 + 橙色装订边，不放任何虚线框 -->
<rect x="132" y="52" width="936" height="200" rx="8" fill="#3a1d18" opacity="0.22" transform="translate(0,5)"/>
<rect x="132" y="52" width="936" height="200" rx="8" fill="#f7efe0"/>
<rect x="132" y="52" width="20" height="200" rx="8" fill="#e9a45c"/>
<rect x="152" y="52" width="3" height="200" fill="#8f3325" opacity="0.35"/>

<!-- 运单右上角的橙色折角（几何，不是 VACANCY 方章） -->
<path d="M1068 52 L1068 82 L1038 52 Z" fill="#e9a45c" opacity="0.75"/>

<!-- 标题与副句之间的砖红分隔粗线：y=160，在三行文案的字身之外，不压字 -->
<rect x="220" y="162" width="760" height="3" fill="#8f3325" opacity="0.55"/>

<!-- 三条主文案（全部画进图里，基线严格递增 140 → 192 → 230） -->
<text x="600" y="140" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="84" font-weight="700" fill="#8f3325" letter-spacing="10">胖东来</text>
<text x="600" y="192" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="26" fill="#3a1d18" letter-spacing="1">货车司机送货，也能体会到尊重</text>
<text x="600" y="230" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18" fill="#7a5248" letter-spacing="1">善待劳动者，正是它登上公益广告位的原因</text>

<!-- 刊头（y=42）与页脚（y=268）都避开主线基线区间 -->
<text x="1120" y="42" text-anchor="end" font-family="Arial,sans-serif" font-size="15" fill="#f7efe0" letter-spacing="4">PUBLIC WELFARE AD · 02 / 03</text>
<text x="1120" y="268" text-anchor="end" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15" fill="#f7efe0" letter-spacing="2">公益广告位 · 善待劳动者</text>
</svg>
