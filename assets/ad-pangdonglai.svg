<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="胖东来 善待劳动者 货车司机送货也能体会到尊重 公益广告位">
<!--
  广告位第 2 张：胖东来广告卡的**广告设计图**（站点自绘矢量稿，非站长提供的图片素材）。
  站长 2026-11-10 晚指令：「去给胖东来设计一条广告.....我是说首页推荐位，视频中提到的
  胖东来对待劳动者的态度，务必备注，这也是为什么挂上广告位的原因，但不得直接把视频
  链接挂在广告位」。本图据此定稿：
    ① 备注进图里：「备注 · 货车司机送货，也能体会到尊重」——视频提到的对待劳动者的
       态度，原样备注在主文案第二行；第三行写明「善待劳动者，正是它登上公益广告位的
       原因」，即挂上广告位的原因。
    ② 与第 1/3 张同一套视觉语言（深蓝底 + 金色挂牌 + 印章 + 同心弧 + 聚光），
       文案全部是 <text>，三条主文案基线 y 严格递增（140 → 192 → 230），
       与图同坐标系同缩放，结构上不可能叠字/穿模。
    ③ 不含任何 URL、不含任何视频链接（站长明令不得把视频链接挂在广告位）；
       品牌名与头像由 HTML meta 行只链站内详情页。印章「敬」= 敬重劳动者（纯装饰）。
-->
<defs>
  <linearGradient id="pdl-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a1b47"/>
    <stop offset="0.52" stop-color="#1d3f9e"/>
    <stop offset="1" stop-color="#0e2a68"/>
  </linearGradient>
  <radialGradient id="pdl-glow" cx="0.5" cy="0.18" r="0.72">
    <stop offset="0" stop-color="#5b8cf5" stop-opacity="0.42"/>
    <stop offset="1" stop-color="#5b8cf5" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="pdl-gold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f9df8b"/>
    <stop offset="1" stop-color="#e5a336"/>
  </linearGradient>
  <linearGradient id="pdl-plate" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#f2f7ff"/>
  </linearGradient>
  <pattern id="pdl-dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.12"/>
  </pattern>
</defs>

<rect width="1200" height="300" fill="url(#pdl-bg)"/>
<rect width="1200" height="300" fill="url(#pdl-glow)"/>
<rect width="1200" height="300" fill="url(#pdl-dots)"/>

<!-- 顶部聚光：从正中打下一束光，把视线引到中央挂牌 -->
<path d="M600 -20 L292 300 L908 300 Z" fill="#7ea6ff" opacity="0.10"/>

<!-- 右侧同心弧（与第 1/3 张同款，做视觉托底） -->
<g fill="none" stroke="#ffffff" opacity="0.08" stroke-width="2">
  <circle cx="1180" cy="300" r="150"/>
  <circle cx="1180" cy="300" r="190"/>
  <circle cx="1180" cy="300" r="232"/>
</g>

<!-- 左侧民族织带：菱形 + 三角坠（与第 1/3 张同款） -->
<g opacity="0.5" fill="none" stroke="url(#pdl-gold)" stroke-width="2">
  <path d="M46 40 l14 14 -14 14 -14 -14 z"/>
  <path d="M46 88 l14 14 -14 14 -14 -14 z"/>
  <path d="M46 136 l14 14 -14 14 -14 -14 z"/>
  <path d="M46 184 l14 14 -14 14 -14 -14 z"/>
  <path d="M46 232 l14 14 -14 14 -14 -14 z"/>
</g>
<g opacity="0.34" fill="#e2534b">
  <path d="M70 54 l8 0 -4 10 z"/>
  <path d="M70 102 l8 0 -4 10 z"/>
  <path d="M70 150 l8 0 -4 10 z"/>
  <path d="M70 198 l8 0 -4 10 z"/>
  <path d="M70 246 l8 0 -4 10 z"/>
</g>

<!-- 内框金线 -->
<rect x="20" y="14" width="1160" height="272" rx="16" fill="none" stroke="#f7d774" stroke-opacity="0.24" stroke-width="1.5"/>

<!-- 印章：敬（敬重劳动者意象，纯装饰） -->
<g transform="translate(150,150)">
  <circle r="66" fill="#ffffff" opacity="0.06"/>
  <circle r="60" fill="none" stroke="url(#pdl-gold)" stroke-width="3"/>
  <circle r="47" fill="none" stroke="#f7d774" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="4 7"/>
  <text x="0" y="24" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="56" font-weight="700" fill="url(#pdl-gold)" letter-spacing="2">敬</text>
</g>

<!-- 中央挂牌：金边白底，左右各一枚金色挂扣 -->
<g>
  <rect x="300" y="52" width="632" height="200" rx="30" fill="#000000" opacity="0.18" transform="translate(0,4)"/>
  <rect x="300" y="52" width="632" height="200" rx="30" fill="url(#pdl-plate)"/>
  <rect x="300" y="52" width="632" height="200" rx="30" fill="none" stroke="url(#pdl-gold)" stroke-width="3"/>
  <rect x="316" y="68" width="600" height="168" rx="20" fill="none" stroke="#1d3f9e" stroke-opacity="0.10" stroke-width="1"/>
  <rect x="268" y="132" width="32" height="40" rx="8" fill="url(#pdl-gold)" opacity="0.9"/>
  <rect x="932" y="132" width="32" height="40" rx="8" fill="url(#pdl-gold)" opacity="0.9"/>
</g>

<!-- 文案（全部画进图里，与图同比例缩放，永不叠字/穿模）：
     第 2 行 = 站长要求的备注（对待劳动者的态度）；第 3 行 = 挂上公益广告位的原因 -->
<text x="616" y="140" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="84" font-weight="700" fill="#1d3f9e" letter-spacing="10">胖东来</text>
<text x="616" y="192" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="26" fill="#3b5488" letter-spacing="1">备注 · 货车司机送货，也能体会到尊重</text>
<text x="616" y="230" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18" fill="#7b8db3" letter-spacing="1">善待劳动者，正是它登上公益广告位的原因</text>

<!-- 角标 -->
<text x="1120" y="42" text-anchor="end" font-family="Arial,sans-serif" font-size="15" fill="#9db8e8" letter-spacing="4">PUBLIC WELFARE AD · 02 / 03</text>
<text x="1120" y="266" text-anchor="end" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15" fill="#9db8e8" letter-spacing="2">公益广告位 · 善待劳动者</text>
</svg>
