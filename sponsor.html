<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>赞助本项目｜双休购 ShuangxiuGo</title>
    <meta
      name="description"
      content="本项目基于 ZhiqingHeyi/shuangxiugou 开源修改（MIT）。若你认可这个项目，欢迎支持它继续维护，或为本站提交你所在企业的真实双休数据。"
    />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#0F766E" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        padding: 48px 20px;
        background: #f8fafc;
        color: #1f2937;
        font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        line-height: 1.8;
        text-align: center;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border: 1px solid #99f6e4;
        border-radius: 999px;
        background: #f0fdfa;
        color: #0f766e;
        font-size: 13px;
        font-weight: 600;
      }
      h1 {
        margin: 0;
        font-size: clamp(20px, 5vw, 28px);
        font-weight: 700;
        color: #111827;
      }
      .origin {
        margin: 0;
        max-width: 620px;
        font-size: 15px;
        color: #4b5563;
      }
      .origin a { color: #0f766e; }
      .card {
        padding: 18px;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 8px 28px rgba(15, 118, 110, .08);
      }
      .card img {
        display: block;
        width: min(320px, 72vw);
        height: auto;
        border-radius: 10px;
      }
      .caption {
        margin: 0;
        max-width: 560px;
        font-size: 14px;
        color: #4b5563;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }
      .btn {
        display: inline-block;
        padding: 11px 24px;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        transition: transform .15s ease, background .15s ease;
      }
      .btn-primary {
        background: #0f766e;
        color: #fff;
        box-shadow: 0 6px 18px rgba(15, 118, 110, .22);
      }
      .btn-primary:hover { background: #115e59; transform: translateY(-1px); }
      .btn-ghost {
        background: #fff;
        color: #0f766e;
        border: 1px solid #99f6e4;
      }
      .btn-ghost:hover { background: #f0fdfa; transform: translateY(-1px); }
      .note {
        margin: 0;
        max-width: 640px;
        padding-top: 20px;
        border-top: 1px solid #e5e7eb;
        font-size: 13px;
        color: #6b7280;
      }
      .note strong { color: #374151; }
    </style>
  </head>
  <body>
    <span class="badge">● 双休购 · ShuangxiuGo</span>
    <h1>赞助本项目</h1>
    <p class="origin">
      本站基于 <a href="https://github.com/ZhiqingHeyi/shuangxiugou" target="_blank" rel="noopener noreferrer">ZhiqingHeyi/shuangxiugou</a>
      开源修改（MIT License）搭建。下面是本项目的收款码，感谢你的支持。
    </p>

    <div class="card">
      <img src="./sponsor-support.jpg" alt="本项目赞助收款码" />
    </div>
    <p class="caption">扫码支持这个项目继续维护</p>

    <div class="actions">
      <a class="btn btn-primary" href="./">返回首页查双休</a>
      <a class="btn btn-ghost" href="https://github.com/dujeongil-galaxy/shuangxiugou/issues/new" target="_blank" rel="noopener noreferrer">
        提交你所在企业的真实双休数据
      </a>
    </div>

    <p class="note">
      <strong>这个项目做的事：</strong>收录具名企业的真实双休率与平均下班时间，附公开证据链，
      帮助求职者避雷单休、大小周、996，也帮消费者在购物前了解品牌背后的用工制度。
      <br />
      它的可持续性不靠赞助，靠的是<strong>更多人把真实工时数据补进来</strong>。
    </p>
  </body>
</html>
