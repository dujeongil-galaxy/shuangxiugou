<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>赞助本项目｜双休购 ShuangxiuGo</title>
    <meta
      name="description"
      content="本项目基于 ZhiqingHeyi/shuangxiugou 开源项目（MIT）二次开发，由 dujeongil-galaxy 负责维护。若你认可这个项目，欢迎赞助支持，或提交你所在企业的真实双休数据。"
    />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#0F766E" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 44px 20px;
        background: #f8fafc;
        color: #1f2937;
        font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        line-height: 1.8;
        text-align: center;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border: 1px solid #99f6e4;
        border-radius: 999px;
        background: #f0fdfa;
        color: #0f766e;
        font-size: 13px;
        font-weight: 600;
      }
      h1 {
        margin: 0;
        font-size: clamp(20px, 5vw, 28px);
        font-weight: 700;
        color: #111827;
      }
      .origin {
        margin: 0;
        max-width: 640px;
        font-size: 15px;
        color: #4b5563;
      }
      .origin a { color: #0f766e; }

      /* ===== 收款面板 ===== */
      .panel {
        width: 100%;
        max-width: 452px;
        padding: 20px;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 8px 28px rgba(15, 118, 110, .08);
        text-align: left;
      }
      .field + .field { margin-top: 18px; }
      .label {
        display: block;
        margin-bottom: 9px;
        font-size: 13px;
        font-weight: 700;
        color: #374151;
      }
      .opts { display: flex; flex-wrap: wrap; gap: 8px; }
      .opt {
        padding: 8px 15px;
        border: 1px solid #e5e7eb;
        border-radius: 9px;
        background: #f9fafb;
        color: #4b5563;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all .15s ease;
        font-family: inherit;
      }
      .opt:hover:enabled { border-color: #5eead4; background: #f0fdfa; }
      .opt[aria-pressed="true"] {
        border-color: #0f766e;
        background: #0f766e;
        color: #fff;
        font-weight: 600;
      }
      .opt:disabled { opacity: .38; cursor: not-allowed; }

      .qr {
        display: block;
        width: 100%;
        max-width: 262px;
        height: auto;
        margin: 18px auto 0;
        padding: 12px;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        background: #fff;
      }
      .addr {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 14px 0 0;
        padding: 11px 13px;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        background: #f9fafb;
      }
      .addr code {
        flex: 1;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        line-height: 1.5;
        color: #1f2937;
        word-break: break-all;
        text-align: left;
      }
      .copy {
        flex-shrink: 0;
        padding: 5px 11px;
        border: 1px solid #0f766e;
        border-radius: 7px;
        background: #fff;
        color: #0f766e;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        transition: all .15s ease;
      }
      .copy:hover { background: #0f766e; color: #fff; }
      .meta {
        margin: 12px 0 0;
        font-size: 13px;
        color: #6b7280;
      }
      .meta b { color: #374151; }
      .chain-note {
        margin: 12px 0 0;
        padding: 10px 12px;
        border-radius: 9px;
        background: #fef3c7;
        color: #92400e;
        font-size: 12.5px;
        line-height: 1.65;
        text-align: left;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }
      .btn {
        display: inline-block;
        padding: 11px 24px;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        transition: transform .15s ease, background .15s ease;
      }
      .btn-primary {
        background: #0f766e;
        color: #fff;
        box-shadow: 0 6px 18px rgba(15, 118, 110, .22);
      }
      .btn-primary:hover { background: #115e59; transform: translateY(-1px); }
      .btn-ghost {
        background: #fff;
        color: #0f766e;
        border: 1px solid #99f6e4;
      }
      .btn-ghost:hover { background: #f0fdfa; transform: translateY(-1px); }
      .note {
        margin: 0;
        max-width: 640px;
        padding-top: 18px;
        border-top: 1px solid #e5e7eb;
        font-size: 13px;
        color: #6b7280;
      }
      .note strong { color: #374151; }
    </style>
  </head>
  <body>
    <span class="badge">● 双休购 · ShuangxiuGo</span>
    <h1>赞助本项目</h1>
    <p class="origin">
      本站基于 <a href="https://github.com/ZhiqingHeyi/shuangxiugou" target="_blank" rel="noopener noreferrer">ZhiqingHeyi/shuangxiugou</a>
      开源项目（MIT License）二次开发搭建。<strong>原作者的版权声明与署名完整保留</strong>，
      目前的二次开发、数据核实与日常维护由
      <a href="https://github.com/dujeongil-galaxy" target="_blank" rel="noopener noreferrer">dujeongil-galaxy</a>
      负责。
    </p>

    <div class="panel">
      <div class="field">
        <span class="label">选择交易所</span>
        <div class="opts" id="exOpts" role="group" aria-label="交易所"></div>
      </div>

      <div class="field">
        <span class="label">选择币种 / 链</span>
        <div class="opts" id="coinOpts" role="group" aria-label="币种"></div>
      </div>

      <img class="qr" id="qr" alt="收款码" />

      <div class="addr">
        <code id="addr"></code>
        <button class="copy" id="copy" type="button">复制</button>
      </div>

      <p class="meta" id="meta"></p>
      <p class="chain-note" id="note"></p>
    </div>

    <div class="actions">
      <a class="btn btn-primary" href="./">返回首页查双休</a>
      <a class="btn btn-ghost" href="https://github.com/dujeongil-galaxy/shuangxiugou/issues/new" target="_blank" rel="noopener noreferrer">
        提交你所在企业的真实双休数据
      </a>
    </div>

    <p class="note">
      <strong>这个项目做的事：</strong>收录具名企业的真实双休率与平均下班时间，附公开证据链，
      帮助求职者避雷单休、大小周、996，也帮消费者在购物前了解品牌背后的用工制度。
      <br />
      这些数据全部由维护者逐条核实公开来源后录入，<strong>维护者的核实工作离不开这些支持</strong>。
    </p>

    <script>
      // 交易所：Gate 已配置 UID；其余待补充，未配置时置灰不可选
      var EXCHANGES = [
        { id: 'binance', name: '币安', uid: '' },
        { id: 'huobi',   name: '火必', uid: '' },
        { id: 'okx',     name: '欧易', uid: '' },
        { id: 'gate',    name: 'Gate', uid: '34868411' }
      ];

      // 币种：三条链各自的收款地址与最低额度
      var COINS = [
        {
          id: 'usdt-trc20',
          name: 'USDT (Tron-TRC20)',
          addr: 'TRyy3C668REPBGo2dDU1yiREdCyegFqjRN',
          qr: './crypto-qr/usdt-trc20.png',
          min: '0.01 USDT',
          note: '请务必选择 <b>Tron (TRC20)</b> 网络发送。其他网络（ERC20 / BEP20 等）的 USDT 无法到账。'
        },
        {
          id: 'btc-brc20',
          name: 'Bitcoin (BRC20)',
          addr: '1Kzj4hEpcroaHfCyfKy8iNsRHVHopjrmQy',
          qr: './crypto-qr/btc-brc20.png',
          min: '0.000006 BTC',
          note: '地址以 <b>1</b> 开头，为原生 SegWit 地址。若你持有的是 BRC20 代币，请确认钱包支持该网络。'
        },
        {
          id: 'eth-erc20',
          name: 'Ethereum (ERC20)',
          addr: '0xAFA6c5C86CcE6e404236a53724cacd9d839DC90c',
          qr: './crypto-qr/eth-erc20.png',
          min: '0.000006 ETH',
          note: '请选择 <b>ERC20 (Ethereum)</b> 网络。其他网络（BSC / Polygon 等）的 ETH 无法到账。'
        }
      ];

      var selEx = 'gate';
      var selCoin = 'usdt-trc20';

      function findEx(id) {
        for (var i = 0; i < EXCHANGES.length; i++) if (EXCHANGES[i].id === id) return EXCHANGES[i];
        return null;
      }
      function findCoin(id) {
        for (var i = 0; i < COINS.length; i++) if (COINS[i].id === id) return COINS[i];
        return null;
      }

      function renderEx() {
        var box = document.getElementById('exOpts');
        box.innerHTML = '';
        EXCHANGES.forEach(function (ex) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'opt';
          b.textContent = ex.name;
          if (!ex.uid) {
            b.disabled = true;          // 未填 UID 的交易所暂不可选
            b.title = '待配置';
          } else {
            b.setAttribute('aria-pressed', selEx === ex.id ? 'true' : 'false');
            b.onclick = function () { selEx = ex.id; renderEx(); renderMeta(); };
          }
          box.appendChild(b);
        });
      }

      function renderCoin() {
        var box = document.getElementById('coinOpts');
        box.innerHTML = '';
        COINS.forEach(function (c) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'opt';
          b.textContent = c.name;
          b.setAttribute('aria-pressed', selCoin === c.id ? 'true' : 'false');
          b.onclick = function () { selCoin = c.id; renderCoin(); renderCoinInfo(); };
          box.appendChild(b);
        });
      }

      function renderCoinInfo() {
        var c = findCoin(selCoin);
        if (!c) return;
        document.getElementById('qr').src = c.qr;
        document.getElementById('qr').alt = c.name + ' 收款码';
        document.getElementById('addr').textContent = c.addr;
        document.getElementById('note').innerHTML = c.note;
        renderMeta();
      }

      function renderMeta() {
        var c = findCoin(selCoin);
        var ex = findEx(selEx);
        if (!c) return;
        var html = '最低充值额 <b>' + c.min + '</b>';
        if (ex && ex.uid) html += ' · ' + ex.name + ' UID <b>' + ex.uid + '</b>';
        document.getElementById('meta').innerHTML = html;
      }

      document.getElementById('copy').onclick = function () {
        var c = findCoin(selCoin);
        var btn = this;
        function done() {
          btn.textContent = '已复制';
          setTimeout(function () { btn.textContent = '复制'; }, 1600);
        }
        function fallback() {
          var ta = document.createElement('textarea');
          ta.value = c.addr;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); done(); }
          catch (e) { btn.textContent = '请手动复制'; }
          document.body.removeChild(ta);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(c.addr).then(done, fallback);
        } else {
          fallback();
        }
      };

      renderEx();
      renderCoin();
      renderCoinInfo();
    </script>
  </body>
</html>
