var _MASK = [0x37,0x91,0x5c,0xc3,0x0e];
var _ORDER = [3,0,4,1,2];
var _SEG = ["LHOn6u/8o6gqwG","nfvEMnWi+78thq","1DuGqfXH8Hmq","f4zyeAm/TGJYCZ","Bs46hp4G1jiImg"];
function _restoreKey(){
  var ordered = [];
  for (var k=0;k<5;k++) ordered[k] = _SEG[_ORDER.indexOf(k)];
  var bin = atob(ordered.join(""));
  var rev = "";
  for (var i=0;i<bin.length;i++) rev += String.fromCharCode((bin.charCodeAt(i)-_MASK[i%_MASK.length]+256)%256);
  return rev.split("").reverse().join("");
}

function esc(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
/* 轻量 Markdown 渲染（2026-11-22 站长要求）：AI 返回的 [文字](网址) 要变成可点超链接。
   安全红线：①只认 http/https，javascript:/data: 等危险协议原样留文本、绝不成链；
   ②外链一律 target=_blank + rel=noopener noreferrer（防 tabnabbing）；
   ③href 属性做实体转义，防引号注入；④占位符隔离已生成的 <a>，避免裸网址二次包裹。 */
function md(s){
  var held = [];
  function hold(html){ held.push(html); return "\u0000" + (held.length - 1) + "\u0000"; }
  function safeUrl(u){
    u = u.replace(/&amp;/g,"&"); // esc() 把 & 转成了 &amp;，URL 里还原后再校验
    if(!/^https?:\/\/[^\s"'<>]+$/i.test(u)) return null;
    return u.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  var out = esc(s);
  // ① Markdown 链接 [文字](http(s)网址)
  out = out.replace(/\[([^\]\n]*)\]\((https?:\/\/[^)\s]+)\)/gi, function(m, label, url){
    var u = safeUrl(url);
    return u ? hold('<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+label+'</a>') : label;
  });
  // ② 裸网址 http(s)://...（去掉结尾中文/英文标点）
  out = out.replace(/(^|[\s(（])(https?:\/\/[^\s<>()（）"'“”，。；：！？、]+)/gi, function(m, pre, url){
    var clean = url.replace(/[.,;:!?）)]+$/,"");
    var u = safeUrl(clean);
    return u ? (pre + hold('<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+clean+'</a>')) : m;
  });
  // ③ 原有加粗与数字列表（占位符内不含 ** ，不会被误伤）
  out = out.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/^(\d+)\./gm,"<b>$1.</b>");
  // ④ 还原链接
  return out.replace(/\u0000(\d+)\u0000/g, function(m,i){ return held[+i]; });
}

function loadScript(urls, globalName){
  return new Promise(function(resolve, reject){
    var i = 0;
    function next(){
      if (i >= urls.length) { reject(new Error('解析库加载失败')); return; }
      var s = document.createElement('script');
      s.src = urls[i++]; s.crossOrigin = 'anonymous';
      s.onload = function(){
        if (window[globalName]) resolve(window[globalName]);
        else next();
      };
      s.onerror = next;
      document.head.appendChild(s);
    }
    next();
  });
}
var pdfjsPromise = null, mammothPromise = null;
function ensurePdfjs(){
  if (!pdfjsPromise) pdfjsPromise = loadScript([
    'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.js',
    'https://unpkg.com/pdfjs-dist@4.10.38/build/pdf.min.js'
  ], 'pdfjsLib').then(function(lib){
    if (lib.GlobalWorkerOptions) lib.GlobalWorkerOptions.workerSrc =
      'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.js';
    return lib;
  });
  return pdfjsPromise;
}
function ensureMammoth(){
  if (!mammothPromise) mammothPromise = loadScript([
    'https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js',
    'https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js'
  ], 'mammoth');
  return mammothPromise;
}
function readAsDataURL(file){
  return new Promise(function(resolve, reject){
    var fr = new FileReader();
    fr.onload = function(){ resolve(fr.result); };
    fr.onerror = function(){ reject(new Error('读取文件失败')); };
    fr.readAsDataURL(file);
  });
}

/* PDF：优先抽文本层（最省 token）；扫描件无文本层时渲染前 2 页为 JPEG 交给视觉模型 */
async function parsePdf(file){
  var lib = await ensurePdfjs();
  var buf = await file.arrayBuffer();
  var doc = await lib.getDocument({ data: new Uint8Array(buf) }).promise;
  var text = '', pages = Math.min(doc.numPages, 8);
  for (var n = 1; n <= pages; n++){
    var page = await doc.getPage(n);
    var tc = await page.getTextContent();
    text += tc.items.map(function(it){ return it.str || ''; }).join(' ') + '\n';
  }
  if (text.replace(/\s/g,'').length >= 20) return { text: text.slice(0, 12000) };
  // 扫描件：前 2 页渲染成 JPEG，宽度不超过 1200px
  var shots = [];
  for (var p = 1; p <= Math.min(doc.numPages, 2); p++){
    var pg = await doc.getPage(p);
    var vp = pg.getViewport({ scale: 1 });
    var scale = Math.min(1, 1200 / vp.width);
    var c = document.createElement('canvas');
    c.width = Math.floor(vp.width * scale); c.height = Math.floor(vp.height * scale);
    await pg.render({ canvasContext: c.getContext('2d'), viewport: pg.getViewport({ scale: scale }) }).promise;
    shots.push(c.toDataURL('image/jpeg', 0.75));
  }
  return { dataUrls: shots, text: '[扫描件 PDF，已渲染前 ' + shots.length + ' 页]' };
}

    var isImg = /^image\/(jpeg|png|webp)$/.test(f.type);
    var isPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
    var isDocx = /\.docx$/i.test(f.name) || f.type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
    if (!isImg && !isPdf && !isDocx){
      setAttachHint('不支持 ' + f.name + '：请用 JPG/PNG/WEBP/PDF/DOCX', true);
      continue;
    }
    var limit = isImg ? ATTACH_LIMIT.imageBytes : ATTACH_LIMIT.docBytes;
    if (f.size > limit){
      setAttachHint(f.name + ' 超过 ' + Math.round(limit / 1024 / 1024) + 'MB 上限', true);
      continue;
    }
    var a = { id: ++attachSeq, name: f.name, kind: isImg ? 'image' : (isPdf ? 'pdf' : 'docx'), status: 'parsing' };
    attachments.push(a); accepted++; renderAttachments();
    try{
      if (isImg){
        a.dataUrl = await readAsDataURL(f); a.thumb = a.dataUrl;
      } else if (isPdf){
        var r = await parsePdf(f); a.text = r.text || ''; a.dataUrls = r.dataUrls || [];
      } else {
        var mm = await ensureMammoth();
        var out = await mm.extractRawText({ arrayBuffer: await f.arrayBuffer() });
        a.text = (out.value || '').slice(0, 12000);
      }
      a.status = 'done';
    }catch(err){
      a.status = 'error'; a.text = '[附件解析失败：' + (err && err.message ? err.message : '未知错误') + ']';
    }
    renderAttachments();
  }
  if (accepted) setAttachHint('已添加 ' + attachments.length + '/' + ATTACH_LIMIT.max + ' 个附件');
  fileInput.value = '';
}
fileInput.addEventListener('change', function(e){ handleFiles(e.target.files); });
renderRoute(); // 附件变量就位后再渲染（renderRoute 内部会调 renderAttachGate）

/* Star 状态实时复核（2026-11-21）：首页 OAuth 回调把服务端签发的加密令牌
   （localStorage.sxg_star_session）带过来，这里打开页面时用它问 Worker「现在还 Star 吗」。
   - 服务端明确 starred / not-starred → 更新本地快照并重渲染：取消 Star 后附件立刻锁死；
     若服务端 KV 留有撤销记录，即使重新 Star 也会继续返回 not-starred（权益永久失效）。
   - 无令牌 / 未配密钥 / 网络失败 / 过期 → 一律静默保留原快照，不打断使用、不弹提示。
   令牌是加密的，前端解不开也改不了（改了验签失败，按无效处理）。 */
async function verifyStarSession(){
  var sat = '';
  try { sat = localStorage.getItem('sxg_star_session') || ''; } catch(e){ return; }
  if (!sat) return; // 老访客/未登录：没有令牌，维持原行为
  var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  var timer = ctl ? setTimeout(function(){ ctl.abort(); }, 8000) : null;
  try {
    var res = await fetch(CFG.cf.endpoint.replace(/\/$/, '') + '/api/check-star', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sat: sat }),
      signal: ctl ? ctl.signal : undefined
    });
    if (!res.ok) return;
    var d = await res.json();
    // 只有这两种明确状态才更新；降级状态（session-unavailable / invalid-session / upstream-error）
    // 一律不动本地快照，避免把已登录用户误判成未登录。
    if (d.status === 'starred' || d.status === 'not-starred'){
      var nowStar = d.status === 'starred' ? '1' : '0';
      var changed = (localStorage.getItem('sxg_github_has_star') || '0') !== nowStar;
      localStorage.setItem('sxg_github_logged_in', '1');
      localStorage.setItem('sxg_github_has_star', nowStar);
      if (typeof d.starDays === 'number') localStorage.setItem('sxg_star_days', String(d.starDays));
      if (d.starredAtDate) localStorage.setItem('sxg_star_date', d.starredAtDate);
      if (changed) renderRoute(); // 状态变了才重渲染（附件门禁随之开/关）
    } else if (d.status === 'invalid-session' || d.status === 'session-unavailable'){
      // 令牌过期或服务端没配密钥：清掉失效令牌，避免每次打开都白查一次
      try { localStorage.removeItem('sxg_star_session'); } catch(e){}
    }
  } catch(e){
    /* 超时/断网：静默降级，保持首屏快照 */
  } finally {
    if (timer) clearTimeout(timer);
  }
}
verifyStarSession();

/* 把附件统一封装成 OpenAI 兼容的 parts：文本用 text，图片用 image_url(data URL) */
function buildParts(question){
  var parts = [{ type: 'text', text: question }];
  attachments.forEach(function(a){
    if (a.status !== 'done') return;
    if (a.kind === 'image' && a.dataUrl){
      parts.push({ type: 'image_url', image_url: { url: a.dataUrl } });
    } else {
      if (a.text) parts.push({ type: 'text', text: '【附件 ' + a.name + '】\n' + a.text });
      (a.dataUrls || []).forEach(function(u){ parts.push({ type: 'image_url', image_url: { url: u } }); });
    }
  });
  return parts;
}
function partsHasImage(parts){ return parts.some(function(p){ return p.type === 'image_url'; }); }

/* CF Worker 能力探测：未部署支持 vision 的新版时，图片附件诚实降级，不静默吞掉；
   顺带从响应里拿 visitorIp（CF-Connecting-IP）用于安全公告。
   2026-11-21 修订：国内直连 workers.dev 常挂起，原版 fetch 无超时会阻塞 renderIpNotice，
   导致公告永久停在「正在获取」；这里加 3 秒超时，超时按 CF 不可用处理，IP 改走下方降级源。 */
async function cfSupportsVision(){
  if (capsCache) return capsCache;
  try{
    var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = ctl ? setTimeout(function(){ ctl.abort(); }, 3000) : null;
    var r = await fetch(CFG.cf.endpoint.replace(/\/$/, '') + '/api/capabilities',
      ctl ? { signal: ctl.signal, cache: 'no-store' } : { cache: 'no-store' });
    if (timer) clearTimeout(timer);
    capsCache = r.ok ? await r.json() : { vision: false };
  }catch(e){ capsCache = { vision: false }; }
  return capsCache;
}
function escIp(s){
  return typeof s === 'string' && /^[0-9a-fA-F.:, ]{1,80}$/.test(s.trim()) ? s.trim() : '未知';
}
/* IP 来源优先级（2026-11-21 修订，加入国内直连优先源）：
   ① CF Worker 的 CF-Connecting-IP —— 服务端从连接层拿的真实 IP，前端无法伪造；
   ② myip.ipip.net —— 国内直连可达（实测约 3.4s、CORS 开放、免 token），国内用户优先；
   ③ api.ipify.org —— 国际兜底（实测国内约 4.4s，旧的 4s 超时会被 abort）；
   ④ 全失败才显示「未知」。IP 只回显给用户自己作安全警示，不落库、不发给第三方解析。
   ②③ 并行竞速，谁先拿到合法 IP 用谁；8 秒超时覆盖国内高延迟，避免公告卡住。 */
var IPIP_ENDPOINT = 'https://myip.ipip.net/json';
var IPIFY_ENDPOINT = 'https://api.ipify.org?format=json';
function fetchJsonWithTimeout(url, ms){
  return new Promise(function(resolve, reject){
    var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = ctl ? setTimeout(function(){ ctl.abort(); }, ms) : null;
    fetch(url, ctl ? { signal: ctl.signal, cache: 'no-store' } : { cache: 'no-store' })
      .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function(j){ if (timer) clearTimeout(timer); resolve(j); })
      .catch(function(e){ if (timer) clearTimeout(timer); reject(e); });
  });
}
async function resolveVisitorIp(){
  var fromCF = capsCache && capsCache.visitorIp;
  if (escIp(fromCF) !== '未知') return { ip: escIp(fromCF), source: 'cf' };
  return new Promise(function(resolve){
    var pending = 2, settled = false;
    function succeed(r){ if (!settled){ settled = true; resolve(r); } }
    function fail(){ if (--pending === 0 && !settled){ settled = true; resolve({ ip: '未知', source: 'none' }); } }
    fetchJsonWithTimeout(IPIP_ENDPOINT, 8000)
      .then(function(j){ var ip = escIp(j && j.data && j.data.ip); ip !== '未知' ? succeed({ ip: ip, source: 'ipip' }) : fail(); })
      .catch(fail);
    fetchJsonWithTimeout(IPIFY_ENDPOINT, 8000)
      .then(function(j){ var ip = escIp(j && j.ip); ip !== '未知' ? succeed({ ip: ip, source: 'ipify' }) : fail(); })
      .catch(fail);
  });
}
async function renderIpNotice(){
  var box = document.getElementById('ipNotice');
  var res = await resolveVisitorIp();
  box.setAttribute('data-ip-source', res.source);
  var ip = res.ip;
  box.innerHTML = '你当前访问的 IP 地址是 <b>' + ip + '</b>。请勿向 AI 发送身份证号、住址等个人敏感信息；'
    + '本功能仅限合理使用，<span class="ip-warn">请求过于频繁将触发短时限流，请间隔片刻再试</span>。';
}
/* 无论 CF 能力探测成功/失败/超时，都必须渲染公告——不能让安全提示卡在「正在获取」。 */
cfSupportsVision().then(renderIpNotice, renderIpNotice);

function userTextForDisplay(parts){
  return parts.map(function(p){ return p.type === 'text' ? p.text : '[图片附件]'; }).join('\n');
}

document.getElementById("chips").addEventListener("click", function(e){
  var b = e.target.closest(".chip");
  if (!b) return;
  inp.value = b.dataset.q;
  inp.focus();
});

inp.addEventListener("keydown", function(e){
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); doSend(); }
});
send.addEventListener("click", doSend);

async function doSend(){
  if (busy) return;
  var q = inp.value.trim();
  if (!q && !attachments.length) return;
  /* 站长写死（2026-11-22）：命中「Boss直聘」关键词 → 直接返回固定链接，
     不调用任何 AI 线路、不受限流/附件锁/Key 影响，优先于一切其它逻辑。 */
  if (isBossHit(q)){
    inp.value = "";
    addMsg("user", q);
    var bb = addMsg("ai", "");
    bb.innerHTML = md(BOSS_FIXED_ANSWER);
    chatLog.push({role:"user", content: q});
    chatLog.push({role:"assistant", content: BOSS_FIXED_ANSWER});
    scrollBottom();
    attachments = []; renderAttachments(); setAttachHint('JPG/PNG/WEBP/PDF/DOCX · 最多 3 个');
    inp.focus();
    return;
  }
  if (attachments.some(function(a){ return a.status === 'parsing'; })){
    setAttachHint('附件还在解析，请稍候…', true); return;
  }
  /* 附件锁死：发送前再判一次，绕过禁用的文件入口也发不出去 */
  if (attachments.length && !starStatus().attachUnlocked){
    attachments = []; renderAttachments();
    setAttachHint('附件暂未开放，解锁后即可使用。', true);
    return;
  }
  /* 国内直连本地限流：未登录 10 次/小时、登录 20 次/小时，与 CF 同口径 */
  if (currentRoute === 'cn' && !cnRateOk()){
    addMsg("ai", '请求过于频繁将触发短时限流，请间隔片刻再试。', true);
    return;
  }
  inp.value = "";
  busy = true; send.disabled = true; send.textContent = "回复中…";
  var parts = buildParts(q || '请分析我上传的附件');
  var hasImage = partsHasImage(parts);
  var display = userTextForDisplay(parts);
  addMsg("user", display);
  // 把图片缩略图挂到刚发出的用户气泡上（不参与 AI 请求，纯展示）
  var lastBub = chat.lastElementChild.querySelector('.bubble');
  if (hasImage){
    attachments.forEach(function(a){
      if (a.kind === 'image' && a.dataUrl){
        var im = document.createElement('img'); im.className = 'a-shot'; im.src = a.dataUrl;
        lastBub.appendChild(im);
      }
    });
    (attachments[0] && attachments[0].dataUrls || []).forEach(function(u){
      var im = document.createElement('img'); im.className = 'a-shot'; im.src = u; lastBub.appendChild(im);
    });
  }
  var userContent = parts;
  chatLog.push({role:"user", content: userContent});
  var bub = addMsg("ai", "");
  var full = "";
  // 等待首字的反馈（2026-11-22）：推理模型首字要几秒，先显示「深度思考中」，
  // 而不是一个空光标干转；收到第一个字时由 onPiece 清掉它。
  var thinkingOn = true;
  function showThinking(){
    bub.innerHTML = '<span class="thinking"><span class="tdot"></span><span class="tdot"></span><span class="tdot"></span>AI 正在深度思考中…</span>';
  }
  if (currentRoute === 'cf') showThinking();

  /* 国内线路需要 Key；缺 Key 时给明确提示 */
  if (currentRoute === 'cn'){
    var key = _restoreKey();
    if (!key || key.indexOf("PLACEHOLDER") >= 0){
      bub.innerHTML = '<b>国内线路还没配置 API Key。</b>\n请切回 Cloudflare，或让站长配置 Key 后重试。';
      chatLog.pop(); busy=false; send.disabled=false; send.textContent="发送"; return;
    }
  }
  /* CF 线路带图：先问 Worker 是否升级；没升级就明确提示，不假装已识别 */
  if (currentRoute === 'cf' && hasImage){
    var caps = await cfSupportsVision();
    if (!caps.vision){
      bub.className = 'bubble err-card';
      bub.textContent = 'Cloudflare 线路当前版本不支持图片/文档识别（站长尚未部署新版 Worker）。请切到「国内直连」重试，或只用文字提问。';
      chatLog.pop(); busy=false; send.disabled=false; send.textContent="发送"; return;
    }
  }

  try{
    if (currentRoute === 'cn'){
      await askCN(chatLog, bub, function(piece){ full += piece; bub.innerHTML = md(full); scrollBottom(); });
    } else {
      /* CF：只发问题 + 历史（最近 4 轮），Worker 自己锁角色、自己限流
         流式：首字到达后逐字追加渲染；老 Worker 降级为非流式一次性返回。 */
      var hist = chatLog.slice(0, -1).slice(-8).map(function(m){ return { role: m.role, content: textOf(m.content).slice(0,200) }; });
      var ans = await askCF(q || '请分析我上传的附件', hist, parts, function(piece, first){
        if (first && thinkingOn){ thinkingOn = false; bub.innerHTML = ''; }
        full += piece;
        bub.innerHTML = md(full) + '<span class="cursor"></span>';
        scrollBottom();
      });
      if (thinkingOn) thinkingOn = false; // 非流式降级：下面一次性渲染
      full = ans;
      bub.innerHTML = md(full); scrollBottom();
    }
    if (!full) bub.innerHTML = "（没有收到内容，请稍后重试）";
    chatLog.push({role:"assistant", content: full});
  }catch(err){
    bub.className = "bubble err-card";
    bub.textContent = "出错了：" + (err && err.message ? err.message : err);
    chatLog.pop();
  }finally{
    busy = false; send.disabled = false; send.textContent = "发送";
    attachments = []; renderAttachments(); setAttachHint('JPG/PNG/WEBP/PDF/DOCX · 最多 3 个');
    inp.focus();
  }
}
function textOf(content){
  if (typeof content === 'string') return content;
  if (Array.isArray(content)) return content.map(function(p){ return p.type === 'text' ? p.text : '[图片]'; }).join(' ');
  return String(content || '');
}

/* 国内线路：硅基流动 OpenAI 兼容，SSE 流式；content 为 parts 数组（多模态） */
async function askCN(log, bub, onPiece){
  var key = _restoreKey();
  var msgs = [{role:"system",content:SYSTEM_PROMPT}].concat(log);
  var res = await fetch(CFG.cn.endpoint, {
    method:"POST",
    headers:{ "Content-Type":"application/json", "Authorization":"Bearer " + key },
    body: JSON.stringify({
      model: CFG.cn.model,
      messages: msgs,
      stream: true, max_tokens: CFG.cn.max_tokens, temperature: CFG.cn.temperature
    })
  });
  if (!res.ok){ var t = await res.text(); throw new Error("国内线路返回 " + res.status + "：" + t.slice(0,180)); }
  var reader = res.body.getReader();
  var dec = new TextDecoder("utf-8");
  var buf = "";
  while (true){
    var r = await reader.read();
    if (r.done) break;
    buf += dec.decode(r.value, {stream:true});
    var lines = buf.split("\n");
    buf = lines.pop();
    for (var i=0;i<lines.length;i++){
      var line = lines[i].trim();
      if (!line || line.indexOf("data:") !== 0) continue;
      var data = line.slice(5).trim();
      if (data === "[DONE]") continue;
      try{
        var obj = JSON.parse(data);
        var delta = obj.choices && obj.choices[0] && obj.choices[0].delta;
        var piece = delta && (delta.content || "");
        if (piece) onPiece(piece);
      }catch(err){}
    }
  }
}

/* Cloudflare 线路：Worker 代理；纯文本走 SSE 流式逐字返回，带图走旧版非流式 JSON。
   2026-11-22 站长定规：
   ① 上游推理模型整段憋完才返回 → 干等十几秒像卡死，改流式让首字几秒就到（send 里逐字渲染）。
   ② 20 秒「无数据」超时——发起即计时，每收到一个数据帧就重置、结束清除。
      这样首字 20 秒不来会提示切线路，但正常长回答持续出字不会被误杀。
   ③ 老 Worker 没有 /api/stream，POST 到它会被当普通提问回 JSON（content-type 非 event-stream）
      → 自动走下面的非流式分支，前端无需预先探测，缓存旧页面也能用。 */
async function askCF(question, history, parts, onPiece){
  var base = CFG.cf.endpoint.replace(/\/$/, '');
  var payload = {
    question: question, history: history, route: CFG.cf.route, parts: parts,
    quotaTier: starStatus().logged ? 'full' : 'half'
  };
  var hasImage = parts && parts.some(function(p){ return p && p.type === 'image_url'; });
  var wantStream = !hasImage && typeof onPiece === 'function';

  var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  var timer = null;
  function armTimer(){
    if (!ctl) return;
    if (timer) clearTimeout(timer);
    timer = setTimeout(function(){ ctl.abort(); }, 20000);
  }
  function clearTimer(){ if (timer) { clearTimeout(timer); timer = null; } }
  armTimer();

  var res;
  try {
    res = await fetch(wantStream ? base + '/api/stream' : base, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      signal: ctl ? ctl.signal : undefined,
      body: JSON.stringify(payload)
    });
  } catch (e) {
    clearTimer();
    // 超时/断网必须给明确提示，不能让 send() 的 catch 只显示一串英文 AbortError。
    if (e && e.name === 'AbortError') {
      throw new Error("Cloudflare 线路暂时连不上（响应超时），请切换「国内直连」或稍后再试。");
    }
    throw e;
  }

  var ctype = res.headers.get('content-type') || '';

  // ---------- 流式 SSE：data: {"response":"片断"}\n\n ... data: [DONE] ----------
  if (wantStream && res.ok && /text\/event-stream/i.test(ctype)) {
    var full = '', buf = '', first = true;
    try {
      var reader = res.body.getReader();
      var dec = new TextDecoder('utf-8');
      while (true) {
        var r = await reader.read();
        if (r.done) break;
        armTimer(); // 收到数据重置 20 秒，长回答持续出字就不会超时
        buf += dec.decode(r.value, { stream: true });
        var lines = buf.split('\n');
        buf = lines.pop(); // 末行可能不完整，留到下一帧拼
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].trim();
          if (line.indexOf('data:') !== 0) continue;
          var data = line.slice(5).trim();
          if (data === '[DONE]') continue;
          var obj;
          try { obj = JSON.parse(data); } catch (e2) { continue; }
          // 双格式兼容：Workers AI 老式帧是 {response:"..."}；
          // GLM-4.7-flash 是 OpenAI 兼容模型，流式帧可能是 {choices:[{delta:{content:"..."}}]}。
          // 两种都认，任一种都能逐字渲染——上游换格式也不会丢字。
          var piece = obj && obj.response;
          if (!piece && obj && obj.choices && obj.choices[0]) {
            // 只取 content，不取 reasoning_content——推理模型的思考链不该展示给访客。
            var d0 = obj.choices[0].delta || obj.choices[0].message;
            piece = d0 && d0.content || '';
          }
          if (piece) { onPiece(piece, first); first = false; full += piece; }
        }
      }
    } catch (e) {
      clearTimer();
      if (e && e.name === 'AbortError') {
        throw new Error("Cloudflare 线路暂时连不上（响应超时），请切换「国内直连」或稍后再试。");
      }
      throw e;
    }
    clearTimer();
    if (!full) throw new Error("Cloudflare 线路这次没有返回正文（不是限流），可能是上游繁忙；请重试，或切换「国内直连」。");
    return full;
  }

  // ---------- 非流式 JSON（老 Worker 降级 / 带图）----------
  clearTimer();
  if (!res.ok){
    var t = await res.text();
    var msg = t.slice(0,200);
    if (res.status === 429) msg = "请求较频繁，已触发短时限流，请间隔片刻再试。";
    if (res.status === 403) msg = "本次请求暂时无法完成，请稍等片刻再试或切换线路。";
    throw new Error("Cloudflare 线路返回 " + res.status + "：" + msg);
  }
  var obj2 = await res.json();
  if (obj2.error === 'daily-quota-exhausted') throw new Error("Cloudflare 线路今日额度已用完（UTC 00:00 重置），请稍后再试。");
  if (!obj2.answer) throw new Error("Cloudflare 线路未返回内容：" + JSON.stringify(obj2).slice(0,120));
  return obj2.answer;
}
</script>
