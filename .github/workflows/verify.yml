name: 站点一致性校验

# 这个项目是「React 渲染后抓 DOM 再改写」的事后打补丁架构，
# 数据又分散在压缩 bundle 和 index.html 两处，
# 出错的默认表现是「页面看着正常，但某张卡片少了内容」——即静默失效。
#
# 本工作流在每次 push 后运行 scripts/verify.mjs，把这类静默故障变成红灯。
# 脚本零依赖（纯 Node.js ≥18），不需要 npm install。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 允许手动触发
  workflow_dispatch:

jobs:
  verify:
    name: verify.mjs 静态校验
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 = 完整历史。
      # 校验脚本会用 `git cat-file -e` 核验文档里引用的提交号是否真实存在，
      # 默认的浅克隆（fetch-depth: 1）只有最新 1 个提交的对象，
      # 会把所有历史提交误判成「编造的哈希」。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node 24：GitHub 已弃用 Node 20 runner（actions/checkout@v4、
      # actions/setup-node@v4 仍 target Node 20，会被强制跑在 Node 24 上）。
      # 直接用 Node 24，消除告警。
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 脚本零依赖，不需要 npm install，直接跑。
      # 有任何一项检查失败即 exit 1，GitHub 会把这次 push 标红。
      - name: 运行校验
        run: node scripts/verify.mjs

  pinyin:
    name: 拼音搜索测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 拼音搜索的两个测试需要 jsdom（DOM 行为 + 真实 bundle 端到端）。
      # 只装 jsdom，不装整个 package.json —— 那个里的 next/react 与
      # 本仓库的静态部署架构无关，装了只是拖慢 CI。
      - name: 安装 jsdom
        run: npm install --no-save jsdom

      # 端到端测试会加载真实 bundle 并复刻它的原生过滤算法，
      # 断言「回填的词真能被原生搜索命中」——这是用户最终看到的结果。
      - name: DOM 行为测试
        run: node scripts/test-pinyin-search.cjs

      - name: 端到端测试
        run: node scripts/test-pinyin-e2e.cjs

      # 小票累计金额：199 + 299 = 498 的结算逻辑 + 旧数据迁移
      - name: 小票累计金额测试
        run: node scripts/test-ticket-total.cjs

      # 内置卡小票的 DOM 定位。这组不能省 ——
      # 上一版就是缺了它，定位逻辑写了但对不上真实 DOM，
      # 代码改了、界面没动，还推上线了。详见 PITFALLS 6.7。
      - name: 内置卡小票 DOM 测试
        run: node scripts/test-builtin-ticket-dom.cjs

      # 答案之书随机占位：数据完整性 + 加载顺序 + 真 DOM 覆盖行为
      - name: 答案之书占位测试
        run: node scripts/test-answer-book.cjs

      # 整页渲染：真实 bundle 挂上 React、新卡片真出现在 DOM、无致命报错。
      # 字符串断言全部通过但页面白屏的情况，只有这一组能抓到。
      - name: 整页渲染测试
        run: node scripts/test-render-page.cjs

      # 员工投稿转 GitHub Issue。原来的实现是「假入库」——
      # onSubmit 只改 React 本地 state，400ms 后关窗，数据刷新即丢。
      # 这组测试锁住「必须真的跳 GitHub」且「不许再出现已入库的假承诺」。
      - name: 员工投稿转 Issue 测试
        run: node scripts/test-employee-report.cjs

      # 推荐位：不得把 C 级当成「良心双休替代品牌」推给读者。
      # 起因是读者发现宁德时代详情里推荐了同为 C 级的比亚迪。
      - name: 推荐位逻辑测试
        run: node scripts/test-alternatives.cjs

      # 广告位 LOGO 必须横排「良配」两字。
      # 起因：容器宽度与「2 字 × 字号」正好相等，一个字距偏差就折成竖排两行
      #（用户截图实际发生过）。这类问题 CSS 校验抓不到，只能断言尺寸关系。
      - name: 广告 LOGO 横排测试
        run: node scripts/test-ad-logo.cjs

      # verify.mjs 自身的自检：check() 参数顺序、节号连续性。
      # 今天曾在同一天内两次把 check(cond, msg) 写成 check(msg, cond)，
      # 症状是输出出现「✓ true」—— 标签被当成条件，检查照样绿灯。
      - name: 校验脚本自检
        run: node scripts/test-verify-self.cjs
