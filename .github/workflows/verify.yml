name: 站点一致性校验

# 这个项目是「React 渲染后抓 DOM 再改写」的事后打补丁架构，
# 数据又分散在压缩 bundle 和 index.html 两处，
# 出错的默认表现是「页面看着正常，但某张卡片少了内容」——即静默失效。
#
# 本工作流在每次 push 后运行 scripts/verify.mjs，把这类静默故障变成红灯。
# 脚本零依赖（纯 Node.js ≥18），不需要 npm install。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 允许手动触发
  workflow_dispatch:

jobs:
  verify:
    name: verify.mjs 静态校验
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 = 完整历史。
      # 校验脚本会用 `git cat-file -e` 核验文档里引用的提交号是否真实存在，
      # 默认的浅克隆（fetch-depth: 1）只有最新 1 个提交的对象，
      # 会把所有历史提交误判成「编造的哈希」。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node 24：GitHub 已弃用 Node 20 runner（actions/checkout@v4、
      # actions/setup-node@v4 仍 target Node 20，会被强制跑在 Node 24 上）。
      # 直接用 Node 24，消除告警。
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 脚本零依赖，不需要 npm install，直接跑。
      # 有任何一项检查失败即 exit 1，GitHub 会把这次 push 标红。
      # 先把版本号同步到 HEAD~1 再校验：一次 push 带两个提交（内容+记账）时，
      # index.html 里的版本号可能落后 3 拍，被 §20g 判红——
      # 而 sync-version.yml 的补提交与本 workflow 并行，verify 跑在它之前
      #（2026-10-21 run #576 实际发生）。此处只写工作区文件不提交，无副作用。
      - name: 运行校验
        run: |
          node scripts/sync-version.mjs HEAD~1
          node scripts/verify.mjs

  pinyin:
    name: 拼音搜索测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 拼音搜索的两个测试需要 jsdom（DOM 行为 + 真实 bundle 端到端）。
      # 只装 jsdom，不装整个 package.json —— 那个里的 next/react 与
      # 本仓库的静态部署架构无关，装了只是拖慢 CI。
      - name: 安装 jsdom
        run: npm install --no-save jsdom

      # 端到端测试会加载真实 bundle 并复刻它的原生过滤算法，
      # 断言「回填的词真能被原生搜索命中」——这是用户最终看到的结果。
      - name: DOM 行为测试
        run: node scripts/test-pinyin-search.cjs

      - name: 端到端测试
        run: node scripts/test-pinyin-e2e.cjs

      # 小票累计金额：199 + 299 = 498 的结算逻辑 + 旧数据迁移
      - name: 小票累计金额测试
        run: node scripts/test-ticket-total.cjs

      # 内置卡小票的 DOM 定位。这组不能省 ——
      # 上一版就是缺了它，定位逻辑写了但对不上真实 DOM，
      # 代码改了、界面没动，还推上线了。详见 PITFALLS 6.7。
      - name: 内置卡小票 DOM 测试
        run: node scripts/test-builtin-ticket-dom.cjs

      # 答案之书随机占位：数据完整性 + 加载顺序 + 真 DOM 覆盖行为
      - name: 答案之书占位测试
        run: node scripts/test-answer-book.cjs

      # 整页渲染：真实 bundle 挂上 React、新卡片真出现在 DOM、无致命报错。
      # 字符串断言全部通过但页面白屏的情况，只有这一组能抓到。
      - name: 整页渲染测试
        run: node scripts/test-render-page.cjs

      # 员工投稿转 GitHub Issue。原来的实现是「假入库」——
      # onSubmit 只改 React 本地 state，400ms 后关窗，数据刷新即丢。
      # 这组测试锁住「必须真的跳 GitHub」且「不许再出现已入库的假承诺」。
      - name: 员工投稿转 Issue 测试
        run: node scripts/test-employee-report.cjs

      # 推荐位：不得把 C 级当成「良心双休替代品牌」推给读者。
      # 起因是读者发现宁德时代详情里推荐了同为 C 级的比亚迪。
      - name: 推荐位逻辑测试
        run: node scripts/test-alternatives.cjs

      # 广告位 LOGO 必须横排「良配」两字。
      # 起因：容器宽度与「2 字 × 字号」正好相等，一个字距偏差就折成竖排两行
      #（用户截图实际发生过）。这类问题 CSS 校验抓不到，只能断言尺寸关系。
      - name: 广告 LOGO 横排测试
        run: node scripts/test-ad-logo.cjs

      # verify.mjs 自身的自检：check() 参数顺序、节号连续性。
      # 今天曾在同一天内两次把 check(cond, msg) 写成 check(msg, cond)，
      # 症状是输出出现「✓ true」—— 标签被当成条件，检查照样绿灯。
      - name: 校验脚本自检
        run: node scripts/test-verify-self.cjs

      # 数字搜索必须彻底禁用。
      # 起因：bundle 的搜索是纯子串匹配，条件含 summary / keyProducts，
      # 而这两处满是年份与百分比，输入「1」「2」会命中一堆无关卡片。
      - name: 数字搜索禁用测试
        run: node scripts/test-block-numeric-search.cjs

      # 四格统计点击筛选（红榜=S/A、观察=B、避雷=C）：真渲染整页后真点按钮，
      # 断言各档可见卡数与四格显示一致（16/8/16），虚拟卡不进任何分档。
      - name: 四格筛选测试
        run: node scripts/test-stat-filter.cjs

      # 「富士康补充说明」注入位置（PITFALLS 1.10 的bug ①③④）：
      # 搜中苹果卡要保留、苹果卡被过滤/隐藏要摘除、不得泄漏进华为卡。
      # bug ④ 是「修 bug ③ 时加了道过防御的闸，把说明框当成只属浏览态」。
      - name: 苹果补充说明注入位置测试
        run: node scripts/test-apple-note.cjs

      # 「星巴克消费入座公告」注入位置：与苹果同一套机制（insertStarbucksNote
      # 是 insertAppleNote 的平行实现），PITFALLS 1.10 的三个坑同样要防。
      - name: 星巴克公告注入位置测试
        run: node scripts/test-starbucks-note.cjs

      # 照片 Star 门禁：真校验（拉 GitHub 公开 star 列表）+ Cookie 记忆自动
      # 验证 + 解锁委托 photo-vault。站长四轮实测反馈都在这组断言里
      # （输入即验 / 无痕补验 / 限流自动重试 / 取消 Star 重新上锁）。
      - name: 照片 Star 门禁测试
        run: node scripts/test-photo-gate.cjs

      # 照片解密与灯箱：仓库里只有 .enc 密文，真 .enc + 源码真口令解出与
      # 明文逐字节一致（CI 无明文原件时退而验 JPEG magic），另有 reveal
      # 成功/失败/幂等、灯箱开合与来源免责提示。
      - name: 照片解密与灯箱测试
        run: node scripts/test-photo-vault.cjs

      # 搜索口径修正：summary 命中不得串品牌（「搜瑞幸咖啡出库迪咖啡」）；
      # 2026-10-25 起含搜索容器防护栏场景（输入框消失 bug 的回归）。
      - name: 搜索口径修正测试
        run: node scripts/test-search-scope-fix.cjs

      # 申诉入口政策确认弹窗：拦截 issues 链接先弹政策层
      # （同意并跳转 / 拒绝并关闭，文案逐字断言）。
      - name: 申诉政策弹窗测试
        run: node scripts/test-appeal-policy.cjs

      # 虚拟对比黑榜卡 DOM 层下线（2026-10-26）：初始移除 + noscript
      # 清单删行 + 重渲染兜底 + 不误伤品牌卡。
      - name: 虚拟卡下线测试
        run: node scripts/test-virtual-card-remove.cjs

      # notes.html 锁屏的「我同意/我不同意」门禁行为。
      - name: 笔记锁屏同意门测试
        run: node scripts/test-notes-agree.cjs
